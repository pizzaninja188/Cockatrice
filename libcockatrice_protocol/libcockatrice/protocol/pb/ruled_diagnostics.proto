syntax = "proto3";
package ruled.diagnostics;
import "ruled_v1.proto";

// Capture-only vocabulary. These records never authorize gameplay or expose engine state
// to a participant. A client can receive Context, which contains correlation identifiers only.
message Context {
  string capture_id = 1;
  uint64 request_sequence = 2;
  uint64 command_index = 3;
  string client_request_id = 4;
  string capture_status = 5;
}

message Record {
  uint32 format_version = 1;
  uint64 sequence = 2;
  string kind = 3;
  string message_type = 4;
  bytes payload = 5;
  string correlation_id = 6;
}

// Local maintainer artifact, never a client command. Every step was reconstructed and checked
// before this plan was produced. Servatrice replays it through its ordinary physical projection.
message ResumeStep {
  uint64 source_sequence = 1;
  ruled.v1.PlayerCommand command = 2;
  bytes expected_state_sha256 = 3;
}
message ResumePlan {
  uint32 format_version = 1;
  string parent_capture_id = 2;
  string engine_build = 3;
  string card_data_hash = 4;
  ruled.v1.SessionStart session_start = 5;
  repeated ResumeStep steps = 6;
  repeated ruled.v1.AutoPassPolicy restored_auto_pass_policies = 7;
  uint64 stop_after = 8;
  bool effective_dev_commands_enabled = 9;
  bytes initial_state_sha256 = 10;
  repeated ruled.v1.PlayerDeck display_decks = 11;
  bool comparison_mode = 12;
}
