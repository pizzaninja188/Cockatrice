// How a DamageTargets spell assigns its damage among the targets that were chosen.
enum DamageDivision {
  // CR 601.2d: the caster chooses the split as the spell is cast, at least 1 per target, summing
  // to the total (Fire). The client must collect a per-target damage_amount on each TargetRef.
  DAMAGE_DIVISION_CHOOSE_AT_CAST = 0;
  // Fireball: "divided evenly, rounded down". There is no choice to make, so the division happens
  // on resolution among the targets that are *still* legal then, and the per-target damage_amount
  // on TargetRef is ignored. The client must not prompt for an allocation, must not require one
  // damage per target, and may offer a zero-target cast.
  DAMAGE_DIVISION_EVEN_AT_RESOLUTION = 1;
}

