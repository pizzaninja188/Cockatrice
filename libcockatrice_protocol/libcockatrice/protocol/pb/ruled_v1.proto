syntax = "proto3";

package ruled.v1;

import "google/protobuf/descriptor.proto";

// Every field reachable from RuledEventBatch must declare one of these. The relay's
// reflection-based redaction clears SERVER_ONLY fields from every client copy and clears
// PER_PLAYER fields by default before explicitly restoring the values authorized for one
// recipient. See the classification coverage in ruled_batch_test.
enum FieldVisibility {
  FIELD_VISIBILITY_UNSPECIFIED = 0;
  FIELD_VISIBILITY_PUBLIC = 1;
  FIELD_VISIBILITY_PER_PLAYER = 2;
  FIELD_VISIBILITY_SERVER_ONLY = 3;
}

extend google.protobuf.FieldOptions {
  FieldVisibility field_visibility = 50000;
}

// Intent from a client; carried inside GameCommand Command_RuledPayload.payload
message RuledCommand {
  reserved 15, 26;
  reserved 21;
  reserved "assign_damage_order", "turn_face_up";
  // Tag 9 was AddManaToPool, the client-trusted "mint mana into my pool" command. Removed:
  // mana is now engine-owned and produced only by activating a mana ability (CR 605), so a
  // tampered client can no longer add mana it did not legally produce.
  reserved 9;
  reserved "add_mana_to_pool";
  oneof cmd {
    PassPriority pass_priority = 1;
    CastSpell cast_spell = 2;
    PlayLand play_land = 3;
    MulliganDecision mulligan = 4;
    Concede concede = 5;
    DeclareAttackers declare_attackers = 6;
    DeclareBlockers declare_blockers = 7;
    // Cockatrice "pass turn" in ruled mode: one empty-stack structural advance
    // (active player outside declare blockers; defender during declare blockers).
    PrimitiveYieldStructured primitive_yield_structured = 8;
    // CR 514.1: discard during cleanup when above maximum hand size (vanilla: 7).
    DiscardToHandSize discard_to_hand_size = 10;
    // Opening: randomly chosen player picks who takes the first turn (seat id).
    ChooseStartingPlayer choose_starting_player = 11;
    // Opening (London mulligan): put one hand card on bottom of library; repeat until quota met.
    PutOpeningHandOnBottom put_opening_hand_on_bottom = 12;
    // UI-only: defender's in-progress block pairs. Servatrice broadcasts BlockersPreview without
    // forwarding to the engine; DeclareBlockers remains the legal commit.
    PreviewDeclareBlockers preview_declare_blockers = 13;
    // UI-only: active player's in-progress attacker selection. Servatrice broadcasts AttackersPreview
    // without forwarding to the engine; DeclareAttackers remains the legal commit.
    PreviewDeclareAttackers preview_declare_attackers = 14;
    // Active player assigns combat damage among blockers for one multiply-blocked attacker.
    // assignments must list each blocker exactly once; sum of damage must equal attacker power.
    AssignCombatDamage assign_combat_damage = 16;
    // Activate an activated ability on a battlefield permanent (non-mana abilities only).
    ActivateAbility activate_ability = 17;
    // Choose a target for a triggered ability that is waiting to be placed on the stack (CR 603.3d).
    ChooseTriggerTarget choose_trigger_target = 18;
    // Answer an outstanding ResolutionChoiceRequired (tier-3 custom resolution, CR 608). Generic
    // across every custom card (Brainstorm, Gifts Ungiven, …) — no per-card command.
    SubmitResolutionChoice submit_resolution_choice = 19;
    // UI courtesy: rewind the priority player's most recent still-floating mana ability (CR 605
    // mana abilities resolve immediately, but a digital client may undo a float while it is
    // strictly inconsequential — no mana spent, no spell/ability cast, priority not passed).
    // The engine untaps the source and removes the produced mana; rejected once consequential.
    UndoManaAbility undo_mana_ability = 20;
    // Debug-only cheat command. The engine rejects it outright unless the session was started
    // with dev commands enabled; see DevCommand.
    DevCommand dev_command = 22;
    // Answer an outstanding TriggerOrderRequired: the order this player's simultaneous triggered
    // abilities are put on the stack (CR 603.3b).
    SubmitTriggerOrder submit_trigger_order = 23;
    // UI-only: replace the authenticated sender's phase-stop preferences. Servatrice caches this
    // command and never forwards or records it; engine-bound commands instead carry the complete,
    // server-authored auto_pass_policies snapshot below.
    SetAutoPassPolicy set_auto_pass_policy = 24;
    // Servatrice-only envelope for an authenticated gameplay command plus the complete policy
    // snapshot. Clients may not send this variant; replay records and re-applies it verbatim.
    CanonicalGameplayCommand canonical_gameplay = 25;
    // Execute one engine-published special action on a battlefield permanent.
    ExecutePermanentAction execute_permanent_action = 27;
    // Query only: authenticated relay routes this outside the gameplay/replay path.
    PreviewPayment preview_payment = 28;
  }
}

message SetAutoPassPolicy {
  repeated PhaseId stop_on_own_turn = 1;
  repeated PhaseId stop_on_opponent_turn = 2;
}

message AutoPassPolicy {
  int32 player_id = 1;
  repeated PhaseId stop_on_own_turn = 2;
  repeated PhaseId stop_on_opponent_turn = 3;
}

message CanonicalGameplayCommand {
  // Serialized RuledCommand containing one ordinary engine command. Nested canonical/UI-only
  // commands are rejected by both Servatrice and the engine.
  bytes command = 1;
  // Servatrice-authored rows for seated players, sorted by player_id. An absent player row means
  // "stop", preserving conservative behavior for reconnect/startup races.
  repeated AutoPassPolicy auto_pass_policies = 2;
}

// Undo the most recent undoable mana ability for the commanding player (no payload needed; the
// engine pops its own per-player undo stack). See RuledCommand.undo_mana_ability.
message UndoManaAbility {}

// Debug-only cheat commands for the dev console, so a board state can be built without editing
// deck files or playing turns to reach it.
//
// These are ordinary logged engine commands (they advance command_index and enter the replay
// command log), so determinism and (seed, command log) replay hold. They are gated engine-side,
// not hidden client-side: the engine refuses them unless SessionStart.dev_commands_enabled was
// set AND the sidecar's own TRICERULES_DEV_COMMANDS env var is set. Both halves are required so
// a production sidecar cannot be talked into dev mode from upstream.
//
// Note RuledCommand's `reserved 9`: AddManaToPool was deleted precisely because a tampered
// client could mint mana. DevCommand.add_mana deliberately re-opens that surface, which is
// exactly why the gate is not optional.
message DevCommand {
  // The seat the effect applies to. This is NOT act-as-player: the engine still attributes the
  // command to its sender (PlayerCommand.player_id stays server-filled from the authenticated
  // session), this only names whose zone/pool is affected.
  int32 target_player_id = 1;
  oneof dev {
    DevPutCardInZone put_card_in_zone = 2;
    DevAddMana add_mana = 3;
    DevMoveCard move_card = 4;
  }
}

// Destination zone for DevPutCardInZone. HAND and BATTLEFIELD may be conjured into; the rest are
// move-only (they have separate physical binding maps on the relay side, so reach them by
// conjuring to hand and then moving).
enum DevZone {
  DEV_ZONE_HAND = 0;
  DEV_ZONE_BATTLEFIELD = 1;
  DEV_ZONE_GRAVEYARD = 2;
  DEV_ZONE_EXILE = 3;
  DEV_ZONE_LIBRARY = 4;
}

// Conjure a named card from outside the game (CR 400.11-shaped, though it obeys none of the
// restrictions real wishes do) into a zone.
//
// *Always* creates a new object, even when the player already owns a copy, so repeating the
// command builds multiples — which is the whole point when assembling a board. Use DevMoveCard to
// relocate something that already exists.
//
// Entering the battlefield fires GameEvent::EntersBattlefield, so CR 603.6a ETB triggers fire and
// static abilities register exactly as for a cast permanent, while CR 601 cast triggers correctly
// stay silent — the same event profile as a real put-onto-the-battlefield effect.
message DevPutCardInZone {
  // Oracle card name, resolved through CardRegistry::id_for_name. Never a client-derived slug:
  // card identity is engine-owned.
  string card_name = 1;
  // Hand or battlefield only: the other zones keep separate physical binding maps on the relay
  // side, so reach them by conjuring to hand and then moving.
  DevZone zone = 2;
  // Deliberately violate CR 302.6: the permanent enters without summoning sickness so it can
  // attack or use a tap ability the turn it arrives. Battlefield only; ignored elsewhere.
  // Not implemented as "grant haste" — haste is a real keyword with layer-6 semantics a test may
  // be trying to observe, so the cheat clears the flag directly instead.
  bool ready = 3;
}

// Relocate a card the target player already owns, searching library, graveyard, exile, hand then
// battlefield and taking the first copy found *that is not already in the destination*. Creates
// nothing — it is the counterpart to DevPutCardInZone, and the only way to reach graveyard, exile
// or library, which conjuring cannot.
//
// Skipping the destination is what lets a repeated move walk through multiple copies: otherwise
// the second `move gy X` finds the copy the first one put there, re-moves it to the zone it is
// already in, and reports success while changing nothing.
//
// Rejected when the player owns no copy: silently conjuring one instead would make "move" and
// "put" indistinguishable again. Rejected distinctly when every copy is already in the
// destination, so "nothing left to move" does not read as "you do not own one".
message DevMoveCard {
  string card_name = 1;
  DevZone zone = 2;
  // As DevPutCardInZone.ready. Worth having here too: move_object_to_zone re-asserts summoning
  // sickness on battlefield entry, so moving a permanent onto the battlefield sickens it.
  bool ready = 3;
}

// Add mana to a player's pool. Additive, not an absolute pool. Emptied by the next step/phase
// change exactly like legitimately produced mana (CR 106.4).
message DevAddMana {
  uint32 w = 1;
  uint32 u = 2;
  uint32 b = 3;
  uint32 r = 4;
  uint32 g = 5;
  uint32 c = 6;
}

enum ResolutionChoiceDecision {
  RESOLUTION_CHOICE_DECISION_UNSPECIFIED = 0;
  RESOLUTION_CHOICE_DECISION_DECLINE = 1;
  RESOLUTION_CHOICE_DECISION_PAY_MANA = 2;
  RESOLUTION_CHOICE_DECISION_SELECT_BRANCH = 3;
  RESOLUTION_CHOICE_DECISION_CAST_TRANSFORMED = 4;
}

// A player's answer to a ResolutionChoiceRequired. Object choices use chosen_object_ids (in
// order when the request was `ordered`) and leave decision unspecified. Mana-payment choices use
// an empty object list and explicitly pay or decline.
message SubmitResolutionChoice {
  repeated uint32 chosen_object_ids = 1;
  ResolutionChoiceDecision decision = 2;
  // Zero-based index into ResolutionChoiceRequired.resolution_branches. Used only with
  // RESOLUTION_CHOICE_DECISION_SELECT_BRANCH.
  uint32 selected_branch_index = 3;
  // Present only when accepting a SPECIAL_CAST offer. The source, method, face, modes, and
  // targets are validated against the generation-bound engine offer before any movement.
  CastSpell cast_spell = 4;
  // Present only for CHOICE_KIND_ATTACKING_TOKEN_DEFENDER. The engine validates the complete
  // generation-bound option against the current prompt snapshot; clients must not reconstruct
  // defending-player ownership from battlefield display state.
  CombatDefenderOption chosen_combat_defender = 5;
  // Exact, previewed mixed payment for the current parked Waterbend cost.
  PaymentSelection payment = 6;
  repeated ManaSpendSelection restricted_mana = 7;
}

// A player's answer to a TriggerOrderRequired (CR 603.3b): put THIS trigger on the stack next.
//
// One at a time, not a permutation, because CR 603.3d chooses each ability's targets *as it is put
// on the stack* — so the engine places this one (prompting for its target if it needs one) and only
// then asks which of the remaining triggers goes next. The last trigger of a block is placed
// automatically; there is no choice left to make.
//
// Placement order, not resolution order: what you pick first is put on the stack first and
// therefore resolves LAST (the stack is last-in-first-out, CR 405.5).
message SubmitTriggerOrder {
  uint32 trigger_object_id = 1;
}

// Per-blocker damage from one attacker during assign combat damage.
message DamagePair {
  uint32 blocker_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 damage = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message AssignCombatDamage {
  uint32 attacker_id = 1;
  repeated DamagePair assignments = 2;
  // CR 702.19: trample excess damage assigned to the defending player.
  // Must be 0 for non-trample attackers; for trample, sum(assignments) + defending_player_damage
  // must equal the attacker's power and each blocker must receive >= lethal damage.
  uint32 defending_player_damage = 3;
}

message DiscardToHandSize {
  reserved 1;
  reserved "hand_card_index";
  // Must list exactly (current hand size minus maximum hand size) distinct indices, including a
  // one-element list when discarding a single card. A repeated field keeps index 0 distinct from
  // an absent selection; the removed proto3 scalar could not represent that distinction.
  repeated uint32 hand_card_indices = 2;
}

message PassPriority {}

message PrimitiveYieldStructured {}

message CastSource {
  oneof location {
    // Concealed hand identity remains the short-lived engine slot published in HandSlotMap.
    uint32 hand_index = 1;
    // Public zones use stable engine ObjectIds so pile display order cannot select another card.
    uint32 graveyard_object_id = 2;
    uint32 exile_object_id = 3;
  }
  // Required for ordinary public-zone casts; hand casts use their current private slot.
  optional uint64 expected_zone_change_generation = 4;
}

// CR 601.2b: the announced method whose alternative cost and stack-exit rules apply to this cast.
// UNSPECIFIED is never legal; every coordinated client must state the method explicitly.
enum CastMethod {
  CAST_METHOD_UNSPECIFIED = 0;
  CAST_METHOD_NORMAL = 1;
  CAST_METHOD_FLASHBACK = 2;
  CAST_METHOD_HARMONIZE = 3;
  CAST_METHOD_SIEGE_DEFEAT = 4;
  CAST_METHOD_WARP = 5;
  // An effect-created permission supplies the alternative mana cost and exact permission id.
  CAST_METHOD_PERMISSION = 6;
}

message CastSpell {
  reserved 1, 7;
  reserved "hand_card_index", "flashback";
  repeated TargetRef targets = 2;
  // CR 107.3: value chosen for {X} as the spell is cast. 0 when the cost has no {X} pip.
  uint32 x_value = 3;
  // CR 107.4: per-pip payment choices for flexible mana symbols (hybrid/Phyrexian). Empty
  // when the cost has none.
  repeated FlexPipPayment flex_payments = 4;
  // CR 709/712/715: which face of a multi-face card to cast (split half, MDFC face, adventure
  // half). 0 (default) is the front/primary face, so single-face casts need not set it.
  uint32 face_index = 5;
  // CR 601.2b / 700.2: selected modal choices and each mode's independent target group.
  // Modal spells use this field and leave the legacy `targets` field empty. Mode indices are
  // distinct and the engine resolves selected modes in printed order regardless of submission
  // order.
  repeated SelectedSpellMode selected_modes = 6;
  // Exactly one physical source. Graveyard means flashback; exile requires an engine-issued
  // permission such as Adventure. A missing source is always illegal.
  CastSource source = 8;
  // Explicit choices for authored additional-cost components. `cost_index` indexes the face's
  // ordered additional_costs list; every choice-bearing component appears exactly once.
  repeated CostSelection cost_selections = 9;
  // Exact CR 106.6 contribution groups the player chose to spend. Unlisted restricted groups are
  // never auto-spent; the engine validates every selected group against this spell face.
  repeated ManaSpendSelection restricted_mana = 10;
  // CR 601.2b: announced selections for optional or alternative cast-cost groups. Group and
  // option indices are authored rules identity; a behold option additionally names its chosen
  // hand slot or battlefield permanent.
  repeated CastCostGroupSelection cast_cost_group_selections = 11;
  CastMethod cast_method = 12;
  // Present for engine-previewed payments (Convoke). Ordinary casts retain their existing path.
  PaymentSelection payment = 13;
  // Required for casts authorized by an exile permission. The engine validates this opaque id
  // together with the exact object and zone-change generation before committing any costs.
  optional uint64 casting_permission_id = 14;
}

// One unit paid by a creature; GENERIC is a demand, never colorless mana.
enum ObjectPaymentKind {
  OBJECT_PAYMENT_KIND_UNSPECIFIED = 0;
  OBJECT_PAYMENT_KIND_WHITE = 1;
  OBJECT_PAYMENT_KIND_BLUE = 2;
  OBJECT_PAYMENT_KIND_BLACK = 3;
  OBJECT_PAYMENT_KIND_RED = 4;
  OBJECT_PAYMENT_KIND_GREEN = 5;
  OBJECT_PAYMENT_KIND_GENERIC = 6;
  OBJECT_PAYMENT_KIND_WATERBEND = 7;
}

message PaymentMana {
  uint32 w = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 u = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 b = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 r = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 g = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 c = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message ObjectPaymentContribution {
  CostObjectRef object = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  ObjectPaymentKind kind = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message PaymentSelection {
  uint64 expected_state_revision = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  CostObjectRef source = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated ObjectPaymentContribution convoke = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  PaymentMana mana = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated CostObjectRef waterbend = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message PreviewPayment {
  uint64 transaction_id = 1;
  uint64 revision = 2;
  CastSpell cast_spell = 3;
  // Exactly one proposed action is required. Queries never execute these commands.
  ActivateAbility activate_ability = 4;
  SubmitResolutionChoice resolution_choice = 5;
}

message ObjectPaymentCandidate {
  CostObjectRef object = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated ObjectPaymentKind options = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message PaymentPreview {
  uint64 transaction_id = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint64 revision = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  bool valid = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  string error = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  bool complete = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  string total_cost = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  string remaining_cost = 7 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  PaymentSelection selection = 8 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated ObjectPaymentCandidate candidates = 9 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Refresh can retire stale selections; it must never auto-submit a changed selection.
  bool selection_changed = 10 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated ManaSpendSelection restricted_mana = 11 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message CastCostGroupSelection {
  uint32 group_index = 1;
  uint32 option_index = 2;
  oneof selected_object {
    uint32 hand_index = 3;
    uint32 permanent_id = 4;
  }
  // Required with permanent_id; rejects a leave-and-return between publication and submission.
  uint64 expected_zone_change_generation = 5;
}

message ManaSpendSelection {
  uint32 restriction_group_id = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 w = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 u = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 b = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 r = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 g = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 c = 7 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// A payment decision for one flexible mana pip (CR 107.4d–f). Currently only Phyrexian pips
// carry one (the pay-2-life vs pay-mana choice); hybrid/mono-hybrid mana is resolved by the
// engine from the pool. Identified by the pip's position in the spell/ability mana cost.
message FlexPipPayment {
  uint32 pip_index = 1; // index into the cost's pip list
  bool pay_life = 2;    // Phyrexian: pay 2 life instead of the colored mana
}

enum TargetRefKind {
  TARGET_REF_KIND_UNSPECIFIED = 0;
  TARGET_REF_KIND_PLAYER = 1;
  TARGET_REF_KIND_PERMANENT = 2;
  TARGET_REF_KIND_STACK = 3;
  TARGET_REF_KIND_GRAVEYARD = 4;
}

message TargetRef {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Per-target damage amount for DamageTargets (Fireball, Fire); 0 = unused.
  uint32 damage_amount = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Zero-based index into the engine-published LegalTargetGroup list.
  uint32 group_index = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Object domain chosen from the engine-published candidate sets. ObjectId and PlayerId share
  // the wire integer space, so stack presentation must not guess this from the numeric value.
  TargetRefKind kind = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message SelectedSpellMode {
  // Zero-based index into the chosen face's ModalSpellDef.modes list.
  uint32 mode_index = 1;
  // Targets chosen specifically for this mode.
  repeated TargetRef targets = 2;
}

message LandSource {
  oneof location {
    uint32 hand_index = 1;
    uint32 exile_object_id = 2;
  }
}

// One CR 508.1b attacker/defender designation. Both permanent endpoints carry their current
// zone-change generation so a leave-and-return object cannot inherit a staged or committed edge.
// For player defenders, defender_zone_change_generation is zero. defending_player_id is the
// engine-derived player who may block for this edge (the attacked player, planeswalker controller,
// or Battle protector); commands must submit the published value unchanged.
message AttackAssignment {
  uint32 attacker_object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint64 attacker_zone_change_generation = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  TargetRef defender = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint64 defender_zone_change_generation = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 defending_player_id = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// One engine-authored recipient option for a creature entering the battlefield attacking
// (CR 508.4). The attacker does not exist on the battlefield yet, so unlike AttackAssignment this
// carries only the defender edge. `defending_player_id` is the player entitled to block it.
message CombatDefenderOption {
  TargetRef defender = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint64 defender_zone_change_generation = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  int32 defending_player_id = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message PlayLand {
  LandSource source = 1;
  // CR 712: for MDFC land cards, which face to enter the battlefield as (0 = front face,
  // 1 = back face). 0 for single-face lands (field absent or default is always front).
  uint32 face_index = 2;
}

message MulliganDecision {
  bool keep = 1;
}

message ChooseStartingPlayer {
  // Cockatrice seat / engine PlayerId of the player who will take the first turn.
  int32 starting_player_id = 1;
}

message PutOpeningHandOnBottom {
  uint32 hand_card_index = 1;
}

message Concede {}

// Active player names creatures on their battlefield to attack. Empty = no attack.
message DeclareAttackers {
  reserved 1;
  reserved "creature_ids";
  repeated AttackAssignment assignments = 2;
}

message BlockPair {
  uint32 attacker_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 blocker_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Defending player assigns blockers; multiple BlockPairs may share an attacker_id
// (multiple creatures blocking one attacker — CR 509.1h).
message DeclareBlockers {
  repeated BlockPair block_pairs = 1;
}

// Defender-only intent: not applied by the engine (server rejects relay). Used so the
// opponent's client can draw block arrows while assignments are still tentative.
message PreviewDeclareBlockers {
  repeated BlockPair block_pairs = 1;
}

message PreviewDeclareAttackers {
  reserved 1;
  reserved "creature_ids";
  repeated AttackAssignment assignments = 2;
}

// Engine output batch; carried inside GameEvent Event_RuledPayload.payload
message RuledEventBatch {
  repeated RuledEvent events = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  map<int32, LegalActions> legal_by_player = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Standalone requester-only query reply: never merged into a gameplay batch.
  PaymentPreview payment_preview = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// Stable authored presentation identity. Positional command coordinates such as face_index,
// ability_index, option_index, and branch_index never appear in this path. Oracle text remains
// external and optional: clients may select oracle_line_indices only when the complete normalized
// external face matches oracle_text_sha256, otherwise they must use fallback_text verbatim.
enum PresentationPathKind {
  PRESENTATION_PATH_KIND_UNSPECIFIED = 0;
  PRESENTATION_PATH_KIND_SPELL = 1;
  PRESENTATION_PATH_KIND_ABILITY = 2;
  PRESENTATION_PATH_KIND_MODE = 3;
  PRESENTATION_PATH_KIND_CAST_COST_GROUP = 4;
  PRESENTATION_PATH_KIND_CAST_COST_OPTION = 5;
  PRESENTATION_PATH_KIND_RESOLUTION_BRANCH = 6;
  PRESENTATION_PATH_KIND_SEARCH_SLOT = 7;
  PRESENTATION_PATH_KIND_MANA_RESTRICTION = 8;
  PRESENTATION_PATH_KIND_CHOICE = 9;
}

message PresentationPathComponent {
  PresentationPathKind kind = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message PresentationRef {
  string card_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string face_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated PresentationPathComponent path = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated uint32 oracle_line_indices = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string fallback_text = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Engine-supplied display lookup names. They do not define card_id or face_id and are never
  // consulted for rules, legality, identity, or command validation.
  string external_card_name = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string external_face_name = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Lowercase SHA-256 of the normalized full external face (trimmed nonempty LF-separated lines).
  // Empty means external rendering is intentionally unavailable and forces fallback_text.
  string oracle_text_sha256 = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Engine-computed targeting data for one spell or activated ability. Clients use this
// to prevent invalid target selection before the command is sent. The engine is the
// sole source of truth; clients must not replicate this logic from Oracle card text.
message SpellTargets {
  reserved 1 to 6;
  // DamageTargets spells only: fixed total damage to distribute among chosen targets.
  // 0 when the amount is determined by {X} chosen at cast time; client uses its chosen x_value instead.
  uint32 fixed_damage = 7 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // True when this spell uses DamageTargets (requires per-target damage_amount on TargetRef).
  bool is_damage_targets = 8 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // DamageTargets spells only: extra generic mana per target beyond the first (CR 601.2f).
  // Fireball = 1 ("{1} more for each target beyond the first"); Fire = 0. The client adds
  // (targets - 1) * this to the generic mana it collects so the local prompt matches the
  // engine's real cost (the engine independently recomputes this — this is display parity only).
  uint32 extra_mana_per_target = 9 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // DamageTargets spells only: how the damage is split among the chosen targets.
  DamageDivision damage_division = 10 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Ordered, independently prompted groups. Empty only when the action has no targets.
  repeated LegalTargetGroup groups = 11 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // One application per live static ability. The client activates an application when at least
  // one selected typed target is in affected_targets, and deduplicates by application_id across
  // target groups and selected modes. The engine independently recomputes the cost.
  repeated TargetingCostApplication targeting_cost_applications = 12
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // One application per face-authored target-dependent reduction. The client activates an
  // application when at least one selected typed target is in qualifying_targets and deduplicates
  // by application_id across target groups and selected modes. The engine recomputes payment.
  repeated TargetedCostReductionApplication targeted_cost_reduction_applications = 13
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message TargetCandidateRef {
  TargetRefKind kind = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 object_id = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message TargetingCostApplication {
  uint64 application_id = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 generic_mana = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated TargetCandidateRef affected_targets = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

message LegalTargetGroup {
  uint32 group_index = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  string prompt_text = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
