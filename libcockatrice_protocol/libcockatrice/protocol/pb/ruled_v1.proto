syntax = "proto3";

package ruled.v1;

// Intent from a client; carried inside GameCommand Command_RuledPayload.payload
message RuledCommand {
  reserved 15;
  reserved "assign_damage_order";
  // Tag 9 was AddManaToPool, the client-trusted "mint mana into my pool" command. Removed:
  // mana is now engine-owned and produced only by activating a mana ability (CR 605), so a
  // tampered client can no longer add mana it did not legally produce.
  reserved 9;
  reserved "add_mana_to_pool";
  oneof cmd {
    PassPriority pass_priority = 1;
    CastSpell cast_spell = 2;
    PlayLand play_land = 3;
    MulliganDecision mulligan = 4;
    Concede concede = 5;
    DeclareAttackers declare_attackers = 6;
    DeclareBlockers declare_blockers = 7;
    // Cockatrice "pass turn" in ruled mode: one empty-stack structural advance
    // (active player outside declare blockers; defender during declare blockers).
    PrimitiveYieldStructured primitive_yield_structured = 8;
    // CR 514.1: discard during cleanup when above maximum hand size (vanilla: 7).
    DiscardToHandSize discard_to_hand_size = 10;
    // Opening: randomly chosen player picks who takes the first turn (seat id).
    ChooseStartingPlayer choose_starting_player = 11;
    // Opening (London mulligan): put one hand card on bottom of library; repeat until quota met.
    PutOpeningHandOnBottom put_opening_hand_on_bottom = 12;
    // UI-only: defender's in-progress block pairs. Servatrice broadcasts BlockersPreview without
    // forwarding to the engine; DeclareBlockers remains the legal commit.
    PreviewDeclareBlockers preview_declare_blockers = 13;
    // UI-only: active player's in-progress attacker selection. Servatrice broadcasts AttackersPreview
    // without forwarding to the engine; DeclareAttackers remains the legal commit.
    PreviewDeclareAttackers preview_declare_attackers = 14;
    // Active player assigns combat damage among blockers for one multiply-blocked attacker.
    // assignments must list each blocker exactly once; sum of damage must equal attacker power.
    AssignCombatDamage assign_combat_damage = 16;
    // Activate an activated ability on a battlefield permanent (non-mana abilities only).
    ActivateAbility activate_ability = 17;
    // Choose a target for a triggered ability that is waiting to be placed on the stack (CR 603.3d).
    ChooseTriggerTarget choose_trigger_target = 18;
    // Answer an outstanding ResolutionChoiceRequired (tier-3 custom resolution, CR 608). Generic
    // across every custom card (Brainstorm, Gifts Ungiven, …) — no per-card command.
    SubmitResolutionChoice submit_resolution_choice = 19;
    // UI courtesy: rewind the priority player's most recent still-floating mana ability (CR 605
    // mana abilities resolve immediately, but a digital client may undo a float while it is
    // strictly inconsequential — no mana spent, no spell/ability cast, priority not passed).
    // The engine untaps the source and removes the produced mana; rejected once consequential.
    UndoManaAbility undo_mana_ability = 20;
  }
}

// Undo the most recent undoable mana ability for the commanding player (no payload needed; the
// engine pops its own per-player undo stack). See RuledCommand.undo_mana_ability.
message UndoManaAbility {}

// A player's answer to a ResolutionChoiceRequired: the chosen object ids (in order when the
// request was `ordered`). The engine validates them against the parked request's candidates.
message SubmitResolutionChoice {
  repeated uint32 chosen_object_ids = 1;
}

// Per-blocker damage from one attacker during assign combat damage.
message DamagePair {
  uint32 blocker_id = 1;
  uint32 damage = 2;
}

message AssignCombatDamage {
  uint32 attacker_id = 1;
  repeated DamagePair assignments = 2;
  // CR 702.19: trample excess damage assigned to the defending player.
  // Must be 0 for non-trample attackers; for trample, sum(assignments) + defending_player_damage
  // must equal the attacker's power and each blocker must receive >= lethal damage.
  uint32 defending_player_damage = 3;
}

message DiscardToHandSize {
  // Single-card discard (cleanup or legacy); use when discarding exactly one card.
  uint32 hand_card_index = 1;
  // Batch discard in one command: must list exactly (current hand size − 7) distinct indices.
  repeated uint32 hand_card_indices = 2;
}

message PassPriority {}

message PrimitiveYieldStructured {}

message CastSpell {
  uint32 hand_card_index = 1;
  repeated TargetRef targets = 2;
  // CR 107.3: value chosen for {X} as the spell is cast. 0 when the cost has no {X} pip.
  uint32 x_value = 3;
  // CR 107.4: per-pip payment choices for flexible mana symbols (hybrid/Phyrexian). Empty
  // when the cost has none.
  repeated FlexPipPayment flex_payments = 4;
  // CR 709/712/715: which face of a multi-face card to cast (split half, MDFC face, adventure
  // half). 0 (default) is the front/primary face, so single-face casts need not set it.
  uint32 face_index = 5;
}

// A payment decision for one flexible mana pip (CR 107.4d–f). Currently only Phyrexian pips
// carry one (the pay-2-life vs pay-mana choice); hybrid/mono-hybrid mana is resolved by the
// engine from the pool. Identified by the pip's position in the spell/ability mana cost.
message FlexPipPayment {
  uint32 pip_index = 1; // index into the cost's pip list
  bool pay_life = 2;    // Phyrexian: pay 2 life instead of the colored mana
}

message TargetRef {
  uint32 object_id = 1;
}

message PlayLand {
  uint32 hand_card_index = 1;
}

message MulliganDecision {
  bool keep = 1;
}

message ChooseStartingPlayer {
  // Cockatrice seat / engine PlayerId of the player who will take the first turn.
  int32 starting_player_id = 1;
}

message PutOpeningHandOnBottom {
  uint32 hand_card_index = 1;
}

message Concede {}

// Active player names creatures on their battlefield to attack. Empty = no attack.
message DeclareAttackers {
  repeated uint32 creature_ids = 1;
}

message BlockPair {
  uint32 attacker_id = 1;
  uint32 blocker_id = 2;
}

// Defending player assigns blockers; multiple BlockPairs may share an attacker_id
// (multiple creatures blocking one attacker — CR 509.1h).
message DeclareBlockers {
  repeated BlockPair block_pairs = 1;
}

// Defender-only intent: not applied by the engine (server rejects relay). Used so the
// opponent's client can draw block arrows while assignments are still tentative.
message PreviewDeclareBlockers {
  repeated BlockPair block_pairs = 1;
}

message PreviewDeclareAttackers {
  repeated uint32 creature_ids = 1;
}

// Engine output batch; carried inside GameEvent Event_RuledPayload.payload
message RuledEventBatch {
  repeated RuledEvent events = 1;
  map<int32, LegalActions> legal_by_player = 2;
}

// Engine-computed targeting data for one spell or activated ability. Clients use this
// to prevent invalid target selection before the command is sent. The engine is the
// sole source of truth; clients must not replicate this logic from Oracle card text.
message SpellTargets {
  // Battlefield permanents this player may legally target with this spell/ability.
  repeated uint32 valid_permanent_ids = 1;
  // Stack spells this player may legally counter (CounterTargetSpell effects only).
  repeated uint32 valid_stack_ids = 2;
  // Whether the local player (caster/activator) is a legal player target.
  bool can_target_self = 3;
  // Whether each opponent is a legal player target.
  bool can_target_opponent = 4;
  // Graveyard card OIDs valid for ReturnFromGraveyard (and future graveyard-targeting effects).
  // The relay maps these engine OIDs to server card ids via the graveyard OID map.
  repeated uint32 valid_graveyard_ids = 5;
}

message LegalActions {
  repeated string labels = 1;
  // Valid targets per castable face of a hand card that needs a target. Key encodes both the
  // engine hand slot and the face index: key = (hand_slot << 8) | face_index. Single-face cards
  // use face 0 (key == hand_slot << 8); multi-face cards (split / MDFC) emit one entry per face
  // whose half targets, so clients can offer the chosen face's targets and not the union (CR
  // 709/712/715 — e.g. Fire targets "any target", Ice targets "any permanent").
  map<uint32, SpellTargets> valid_targets_by_hand_slot = 3;
  // Per-activated-ability valid targets. Key = (permanent_id << 32 | ability_index).
  // Presence of a key means the ability at that index requires a target.
  map<uint64, SpellTargets> valid_targets_by_ability = 4;
  // Count of this player's mana abilities that are currently undoable via UndoManaAbility (CR 605
  // float courtesy). Non-zero only while strictly inconsequential; clients show an Undo affordance
  // when > 0. Drops to 0 the moment mana is spent, a spell/ability is cast, or priority passes.
  uint32 undoable_mana_abilities = 5;
}

// Servatrice-injected each ruled broadcast: engine hand slot index -> Server_Card.id for that player,
// after server hand zones are synced to the engine (zone_view is stripped for clients).
message HandSlotMap {
  message Entry {
    int32 player_id = 1;
    uint32 hand_index = 2;
    int32 server_card_id = 3;
  }
  repeated Entry entries = 1;
}

message RuledEvent {
  reserved 18;
  reserved "damage_order_assigned";
  oneof ev {
    PhaseChanged phase_changed = 1;
    PriorityChanged priority_changed = 2;
    StackPushed stack_pushed = 3;
    StackResolved stack_resolved = 4;
    SbasApplied sbas_applied = 5;
    GameSnapshot snapshot = 6;
    ReplayState replay_state = 7;
    LogMessage log = 8;
    ZoneViewSync zone_view = 9;
    PermanentMoved permanent_moved = 10;
    LifeChanged life_changed = 11;
    BattlefieldObjectMap battlefield_object_map = 12;
    AttackersDeclared attackers_declared = 13;
    HandSlotMap hand_slot_map = 14;
    // After a successful DeclareBlockers (or defender pass = no blocks). Same BlockPair
    // semantics as the intent; both players' clients use this for combat arrows.
    BlockersDeclared blockers_declared = 15;
    // Servatrice-synthesized from PreviewDeclareBlockers; not emitted by the engine.
    BlockersPreview blockers_preview = 16;
    // Servatrice-synthesized from PreviewDeclareAttackers; not emitted by the engine.
    AttackersPreview attackers_preview = 17;
    // Engine-emitted after active player assigns combat damage for a multiply-blocked attacker.
    CombatDamageAssigned combat_damage_assigned = 19;
    // Engine-emitted when a triggered ability fires and needs the controller to choose a target
    // before the ability is placed on the stack (CR 603.3d).
    TriggerNeedsTarget trigger_needs_target = 20;
    // Engine-provided card identity map for the session's decks; emitted once in the
    // SessionStart response batch. Server-only (enumerates deck contents): Servatrice
    // strips it from client broadcasts alongside zone_view private fields.
    CardCatalog card_catalog = 21;
    // A token came into existence on the battlefield (CR 111). The relay creates a physical
    // token card from the inline identity (tokens have no deck card / CardCatalog entry).
    TokenCreated token_created = 22;
    // A tier-3 custom resolution paused and needs a player to choose among candidates (CR 608).
    // Generic across every custom card; the client renders it as an ordered/multi-select pick.
    ResolutionChoiceRequired resolution_choice_required = 23;
    // A player's mana pool changed (CR 106): engine-authoritative pool after a mana ability
    // produced mana, a cost was paid, or the pool emptied on a step/phase change. The relay
    // mirrors it onto that player's ruled mana-pool counters (Event_SetCounter).
    ManaPoolUpdated mana_pool_updated = 24;
    // An Aura permanent entered the battlefield and attached to an enchanted permanent (CR 303.4).
    // The relay translates this into Event_AttachCard so the client stacks the aura under the
    // enchanted permanent. Also emitted on zone-view reconnect to restore the attachment.
    AuraAttached aura_attached = 25;
    // One or more creatures were removed from combat mid-step (CR 701.15a: regeneration; also
    // covers future tap-out-of-combat effects). Clients remove the corresponding arrows.
    CreaturesRemovedFromCombat removed_from_combat = 26;
    // Server-built graveyard OID map (parallel to battlefield_object_map) so clients can
    // resolve ReturnFromGraveyard valid_graveyard_ids to physical CardItems.
    GraveyardObjectMap graveyard_object_map = 27;
  }
}

// An Aura spell resolved and attached to a permanent on the battlefield (CR 303.4).
// The relay calls Event_AttachCard: aura_object_id attaches to enchanted_object_id.
message AuraAttached {
  uint32 aura_object_id = 1;
  uint32 enchanted_object_id = 2;
}

// Engine-authoritative mana pool snapshot for one player (CR 106). Absolute counts (not deltas),
// so the relay can set the client's mana-pool counters directly. Emitted whenever a pool changes.
message ManaPoolUpdated {
  int32 player_id = 1;
  uint32 w = 2;
  uint32 u = 3;
  uint32 b = 4;
  uint32 r = 5;
  uint32 g = 6;
  uint32 c = 7;
}

// A parked custom resolution (CR 608) requesting input from one player. Reused by every tier-3
// card (and later X-spells / modal spells) — the engine is the sole source of the candidate set,
// so clients never replicate selection logic from Oracle text. The deciding player may be the
// opponent of the spell's controller (Gifts Ungiven).
message ResolutionChoiceRequired {
  // Engine PlayerId who must answer; only that player's client prompts.
  int32 deciding_player_id = 1;
  // The in-flight spell's object id (the stack object being resolved), for display/context.
  uint32 source_object_id = 2;
  // Display-only prompt (server-only; the relay does not look up Oracle text for this).
  string prompt_text = 3;
  // What the candidate ids refer to:
  //   0 = cards in the deciding player's hand (private — redacted from opponents by Servatrice)
  //   1 = revealed cards (public)
  //   2 = cards being searched out of the deciding player's library (private — redacted)
  //   3 = target objects (battlefield permanents, stack spells, or players — public).
  //       The client uses click-to-target mode instead of a list dialog for this kind.
  int32 choice_kind = 4;
  // Candidate object ids to choose among (engine ObjectIds).
  repeated uint32 candidate_object_ids = 5;
  // Parallel to candidate_object_ids: tricerules card id for each candidate, so the relay/client
  // can show names (resolve to Oracle names via CardCatalog) without an oid->card lookup.
  repeated string candidate_card_ids = 6;
  // Inclusive bounds on how many candidates must be chosen.
  uint32 min = 7;
  uint32 max = 8;
  // True when the chosen order is significant (Brainstorm: order cards put back on top).
  bool ordered = 9;
  // Parallel to candidate_object_ids: each candidate's display (Oracle) name, so the deciding
  // player's client renders the choice without a card-id lookup. For HandCards (choice_kind 0)
  // these are private; Servatrice redacts candidate_* for everyone but the deciding player.
  repeated string candidate_names = 10;
  // Parallel to candidate_object_ids: Servatrice's physical card id (Server_Card::getId()) for
  // each candidate, injected by the relay so the client can map engine OIDs to physical hand
  // CardItems without a separate OID→serverCardId table. Only populated for private HandCards
  // (choice_kind 0) on the deciding player's copy; empty for other players and other kinds.
  repeated int32 candidate_server_card_ids = 11;
  // When true, all chosen candidates must have distinct card names (Gifts Ungiven: "four cards
  // with different names"). The client enforces this before submission; the engine re-validates.
  bool unique_names = 12;
}

// A token entered the battlefield (CR 111). Unlike a resolved permanent spell, a token has no
// physical card in any deck/hand/stack and no Oracle cards.xml entry, so it is self-describing:
// the relay builds a token Server_Card from `identity` and binds it to `object_id`.
message TokenCreated {
  uint32 object_id = 1;
  int32 controller_player_id = 2;
  // Engine token id (e.g. "soldier_w_1_1"); intentionally absent from the deck CardCatalog.
  string card_id = 3;
  TokenIdentity identity = 4;
}

// Self-describing token characteristics for the relay and client (tokens are absent from the
// Oracle card database and the session CardCatalog). Public once the token is on the battlefield.
message TokenIdentity {
  string name = 1;            // e.g. "Soldier"
  string pt = 2;              // "1/1" for creatures; empty for noncreature tokens
  string color = 3;           // Cockatrice color string, lowercase wubrg; empty = colorless
  repeated string types = 4;  // e.g. ["Creature", "Soldier"]
  bool is_creature = 5;
  // Static keyword abilities, MTG spelling (e.g. ["Flying"], ["Lifelink"]). Lets the client pick
  // the matching Oracle token art among same-name variants (e.g. vanilla vs. vigilance Knight).
  repeated string keywords = 6;
}

// The single source of card identity for a ruled session: Servatrice sends Oracle names
// into the engine and maps every engine card_id (zone views, stack pushes, object maps)
// back to a name through this catalog — no name->id derivation happens in C++.
message CardCatalog {
  message Entry {
    string card_id = 1;        // engine id, e.g. "lightning_bolt" or "fire_ice"
    string name = 2;           // whole-card Oracle name, e.g. "Lightning Bolt" / "Fire // Ice"
    repeated string types = 3; // from CardDefinition.types (primary face for multi-face cards)
    bool is_permanent = 4;     // CR 110.4: resolves to the battlefield, not the graveyard
    // CR 709/712/715: per-face Oracle names in face order (e.g. ["Fire", "Ice"]). Empty for
    // single-face cards. Lets the relay display the cast/active half by its own name.
    repeated string face_names = 5;
  }
  repeated Entry entries = 1;
}

message CombatDamageAssigned {
  uint32 attacker_id = 1;
  repeated DamagePair assignments = 2;
}

message PhaseChanged {
  string phase = 1;
  int32 active_player_id = 2;
}

message PriorityChanged {
  int32 player_id = 1;
}

message StackPushed {
  uint32 object_id = 1;
  string description = 2;
  // Chosen targets for this spell/ability while it is on the stack (object ids; player targets
  // use the engine's PlayerId as object_id, same as CastSpell.targets).
  repeated TargetRef targets = 3;
  // Text the client overlays on the stack card as an annotation: the ability text for
  // activated/triggered abilities, "X = N" for an X spell (CR 107.3), or the cast face name of a
  // multi-face spell (e.g. "Fire" / "Ice"). Empty for ordinary single-face spells. card_id (below)
  // distinguishes a spell (non-empty: the physical card is already on the stack and only the
  // annotation is overlaid) from an ability (empty: the client builds a synthetic stack card).
  string ability_annotation = 4;
  // Engine card id of the pushed spell (e.g. "lightning_bolt"); empty for abilities,
  // which have no physical card on the stack. Resolve to an Oracle name via CardCatalog.
  string card_id = 5;
  // CR 707.10: true when this stack item is a *copy* of a spell (Twincast/Fork), not a cast
  // object. Like an ability it has no physical card on the shared stack; the client shows it via
  // card_id + the "(copy)" ability_annotation and expects no permanent/graveyard card on resolve.
  bool is_copy = 6;
  // For copies (is_copy == true): the object_id of the original stack item being copied. The
  // client uses this to inherit the original spell's Oracle printing (set/provider) so the copy
  // displays the same card art instead of defaulting to the newest printing.
  uint32 copy_source_object_id = 7;
}

message ActivateAbility {
  uint32 permanent_id = 1;     // ObjectId of the source permanent on the battlefield
  uint32 ability_index = 2;    // Index into card's activated_abilities list
  repeated TargetRef targets = 3;
  // CR 107.4: per-pip payment choices for flexible mana in the ability cost (see CastSpell).
  repeated FlexPipPayment flex_payments = 4;
  // CR 605: for a mana ability with multiple producible options (e.g. a dual land), which
  // option to produce — index into the ability's ProduceMana `options`. The choice is made at
  // activation because mana abilities don't use the stack (CR 605.3b). 0 (default) for
  // single-option mana abilities and all non-mana abilities.
  uint32 mana_option_index = 5;
}

message ChooseTriggerTarget {
  uint32 target_object_id = 1; // ObjectId of the chosen target (permanent) or PlayerId (player)
}

message TriggerNeedsTarget {
  uint32 source_permanent_id = 1;
  uint32 ability_index = 2;
  string ability_text = 3;     // Oracle text of the triggered ability (shown in prompt widget)
  int32 controller_player_id = 4; // PlayerId of the player who controls the trigger
}

// Where the resolved spell object ends up (Servatrice maps this to TABLE vs GRAVE).
enum StackResolveDestination {
  STACK_RESOLVE_DESTINATION_UNSPECIFIED = 0; // legacy: server may infer from Oracle text
  STACK_RESOLVE_DESTINATION_GRAVEYARD = 1;
  STACK_RESOLVE_DESTINATION_BATTLEFIELD = 2;
}

message StackResolved {
  uint32 object_id = 1;
  StackResolveDestination destination = 2;
}

message SbasApplied {
  string description = 1;
}

// Authoritative hand + library from the rules engine, for server to sync physical zones
// (engine card ids, lowercase_underscore; resolve to Oracle names via CardCatalog).
// Library: comma-separated, top of library (next draw) first. TricRules ids never contain commas.
// Field 3 is reserved: older tricerules emitted repeated string there; same tag as singular string
// on the C++ side merged 53 submessages into one wrong value. Use 4+ only for the CSV.
message RuledPerPlayerView {
  int32 player_id = 1;
  repeated string hand = 2;
  reserved 3;
  string lib_ids_csv = 4;
  // Battlefield card ids in controller order (tricerules ids, lowercase_underscore).
  repeated string battlefield = 5;
  // Parallel array to `battlefield`, true if that permanent is tapped.
  repeated bool battlefield_tapped = 6;
  // Parallel array to `battlefield`: engine-owned ObjectId for each permanent.
  // Stable for the lifetime of the permanent on the battlefield. Used to map
  // server-side Server_Card instances to engine objects for combat intents.
  repeated uint32 battlefield_object_id = 7;
  // Parallel array to `battlefield`, true if that permanent is summoning sick.
  repeated bool battlefield_summoning_sick = 8;
  // Parallel array to `battlefield`: engine creature stats for Servatrice/UI sync.
  // When `battlefield_is_creature` is false, ignore power/toughness/damage for that slot.
  repeated uint32 battlefield_power = 9;
  repeated uint32 battlefield_toughness = 10;
  repeated uint32 battlefield_damage = 11;
  repeated bool battlefield_is_creature = 12;
  // Parallel array to `hand`: engine ObjectId for each card in hand order.
  repeated uint32 hand_object_id = 13;
  // Parallel array to `battlefield`, true if that permanent has the Haste keyword
  // (CR 702.10). Used by clients to suppress the summoning-sick indicator and
  // allow attacker selection even when summoning_sick is still true.
  repeated bool battlefield_haste = 14;
  // Parallel array to `battlefield`, true if that permanent has the Trample keyword
  // (CR 702.19). Used by clients to enable trample damage assignment UI.
  repeated bool battlefield_trample = 15;
  // Parallel array to `battlefield`, true if that permanent has the First Strike keyword
  // (CR 702.7). Informational for UI; combat-step routing uses `first_strike_step_pending`.
  repeated bool battlefield_first_strike = 16;
  // Parallel array to `battlefield`, true if that permanent has the Double Strike keyword
  // (CR 702.4). Informational for UI; combat-step routing uses `first_strike_step_pending`.
  repeated bool battlefield_double_strike = 17;
  // True while the current combat will (or did) include a first-strike damage substep
  // (CR 510.4): set whenever any attacker or blocker has First Strike or Double Strike and
  // the first-strike step has not yet resolved for the current combat. Drives the
  // "First Strike Damage" pass-priority button label.
  bool first_strike_step_pending = 18;
  // Parallel array to `battlefield`: pipe-delimited ("|") activated ability texts for each permanent.
  // Empty string for permanents with no activated abilities. Indexed by battlefield position.
  // Used by clients to build the activation context menu.
  repeated string battlefield_activated_ability_texts = 19;
  // Parallel array to `battlefield_activated_ability_texts`: pipe-delimited mana cost strings
  // for each ability, in the same order. Derived from AbilityCost (Tap/Sacrifice → "", Mana/TapAndMana → "4"/"R"/etc.).
  // Clients use this for mana payment without re-parsing the display text.
  repeated string battlefield_activated_ability_mana_costs = 20;
  // Parallel array to `battlefield_activated_ability_texts`: which abilities are mana abilities
  // (CR 605) and what they produce, so the client drives "tap for mana" from engine data rather
  // than guessing colors from Oracle text. Per permanent: abilities joined by "|"; a non-mana
  // ability is the empty string; a mana ability is its ProduceMana options joined by "/", each
  // option a brace-less symbol run ("G", "WU", "CC"). Multiple options (e.g. "W/U") mean the
  // client prompts for a color → ActivateAbility.mana_option_index. Empty string = no abilities.
  repeated string battlefield_activated_ability_mana_produced = 21;
  // Parallel array to `battlefield_activated_ability_texts`: pipe-delimited display-cost strings
  // for each ability (e.g. "{T}", "{4}", "{T}, {4}", "Sacrifice this"). Empty entry means no
  // cost label for that ability. Used by clients to show the full "cost: text" label in the
  // activation context menu.
  repeated string battlefield_activated_ability_cost_labels = 23;
  // Parallel array to `battlefield`: human-readable counter annotation for each permanent
  // (e.g. "1 +1/+1 counter(s)"), one line per counter kind. Empty string for permanents with
  // no counters. Clients overlay this on the card annotation alongside ruled damage.
  repeated string battlefield_counters_annotation = 22;
  // Parallel array to `battlefield`: for Aura/Equipment permanents, the ObjectId of the
  // permanent they are currently attached to, or 0 if unattached. Used by the C++ relay
  // to issue Event_AttachCard after every zone-view sync so clients stack attached permanents
  // visually. Non-aura / non-equipment permanents always carry 0.
  repeated uint32 battlefield_attached_to_oid = 24;
  // Engine ObjectIds for cards in this player's graveyard, in graveyard order.
  // Parallel to the graveyard content the relay already tracks via PermanentMoved.
  // Used by the relay and client to build the graveyard OID→server-card-id map so
  // ReturnFromGraveyard targets can be resolved client-side.
  repeated uint32 graveyard_object_id = 25;
}

message ZoneViewSync {
  repeated RuledPerPlayerView per_player = 1;
}

message GameSnapshot {
  string summary = 1;
}

message ReplayState {
  uint64 seed = 1;
  uint64 command_index = 2;
}

message LogMessage {
  string text = 1;
}

// A permanent left the battlefield (currently only graveyard via SBAs / destroy effects).
// Servers translate this into a Cockatrice moveCard from TABLE to the destination zone.
message PermanentMoved {
  uint32 object_id = 1;
  int32 owner_player_id = 2;
  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_GRAVEYARD = 1;
    DESTINATION_HAND = 2;
    DESTINATION_LIBRARY = 3;
    DESTINATION_EXILE = 4;
    // Used by ReturnFromGraveyard with GraveyardDestination::Battlefield (reanimation).
    DESTINATION_BATTLEFIELD = 5;
  }
  Destination destination = 3;
  // tricerules card id (lowercase_underscore). Lets servers resolve cards that
  // have no engine-oid mapping (e.g. milled library cards) by name within a zone.
  string card_id = 4;
}

// A player's life total changed. delta is signed (negative = loss).
message LifeChanged {
  int32 player_id = 1;
  int32 new_total = 2;
  int32 delta = 3;
}

// Server-built mapping so clients can map graveyard CardItems to engine ObjectIds for
// ReturnFromGraveyard targeting. Sent alongside BattlefieldObjectMap whenever graveyard
// membership changes. Only engine_object_id and server_card_id are needed here (player_id
// is implicit from the zone the card is in on the client).
message GraveyardObjectMap {
  message Entry {
    int32 player_id = 1;
    uint32 engine_object_id = 2;
    // Server_Card.id for the graveyard card; -1 if unknown.
    int32 server_card_id = 3;
  }
  repeated Entry entries = 1;
}

// Server-built mapping (not engine-emitted) so clients can map a CardItem (whose
// id is the Server_Card id on the wire) to the corresponding engine ObjectId.
// Sent alongside ruled batches whenever battlefield membership changes.
message BattlefieldObjectMap {
  message Entry {
    int32 player_id = 1;
    uint32 engine_object_id = 2;
    // tricerules card id (lowercase_underscore)
    string card_id = 3;
    // 0-based position within the controller's battlefield
    uint32 ordinal = 4;
    // Server_Card.id for the same permanent on the Cockatrice side; -1 if unknown.
    int32 server_card_id = 5;
    // True if this permanent currently has summoning sickness.
    bool summoning_sick = 6;
    // True if this permanent has the Haste keyword (CR 702.10). A creature with
    // haste can attack even while summoning_sick is true.
    bool haste = 7;
    // True if this permanent has the Trample keyword (CR 702.19). A trample
    // attacker may assign excess combat damage to the defending player.
    bool trample = 8;
    // Oracle-style texts for each activated ability on this permanent, in index order.
    // Empty for permanents with no activated abilities. Used by clients to build the
    // activation context menu.
    repeated string activated_ability_texts = 9;
    // True if this permanent is a creature (engine-authoritative, from the tricerules
    // registry — NOT the Oracle display DB). Clients use this for combat eligibility so
    // engine-minted tokens (which have no Oracle entry) can be declared as attackers/blockers.
    bool is_creature = 10;
  }
  repeated Entry entries = 1;
}

// Engine-emitted after a successful set_attackers; lists the attacking creatures
// so defenders' clients can highlight attackers (also drives Event_SetCardAttr
// (AttrAttacking) translation server-side).
message AttackersDeclared {
  int32 attacking_player_id = 1;
  repeated uint32 attacker_object_ids = 2;
}

message BlockersDeclared {
  repeated BlockPair block_pairs = 1;
}

message BlockersPreview {
  int32 declaring_player_id = 1;
  repeated BlockPair block_pairs = 2;
}

message AttackersPreview {
  int32 declaring_player_id = 1;
  repeated uint32 attacker_object_ids = 2;
}

// Engine-emitted when one or more creatures are removed from combat mid-step (CR 701.15a).
// Covers regeneration and any future effect that taps or otherwise ejects a creature from combat.
// Clients remove the corresponding attacker/blocker arrows for the listed engine object ids.
message CreaturesRemovedFromCombat {
  repeated uint32 object_ids = 1;
}

// --- Sidecar TCP framing (length-prefixed IpcEnvelope) ---

message IpcEnvelope {
  oneof msg {
    SessionStart session_start = 1;
    PlayerCommand player_command = 2;
    SessionEnd session_end = 3;
    ValidateDeck validate_deck = 4;
  }
}

// Stateless implemented-card check (no engine, no session): the sidecar answers with
// ok = true and an empty missing_card_names iff every name resolves in the registry.
// Servatrice gates ruled game start on this so an unimplemented card never silently
// falls back to casual play. Also the extension point for future deck-editor coverage
// queries (e.g. a ListImplementedCards sibling).
message ValidateDeck {
  repeated string card_names = 1; // Oracle card names, duplicates allowed
}

// Deck lists cross IPC as Oracle card names; the engine resolves names to card ids
// (CardRegistry::id_for_name) and reports the mapping back via CardCatalog.
message PlayerDeck {
  int32 player_id = 1;
  // Was mainboard_card_id (C++-derived tricerules ids); the engine owns identity now.
  reserved 2;
  reserved "mainboard_card_id";
  // Oracle card names (e.g. "Lightning Bolt"), one entry per copy — empty = engine default test deck.
  repeated string mainboard_card_name = 3;
}

message SessionStart {
  uint64 game_id = 1;
  uint64 seed = 2;
  repeated int32 player_ids = 3;
  repeated PlayerDeck player_decks = 4;
  // Servatrice's VERSION_STRING, logged by the sidecar for build-skew observability.
  string servatrice_build = 5;
}

message PlayerCommand {
  int32 player_id = 1;
  bytes ruled_command = 2;
}

message SessionEnd {}

message IpcResponse {
  bool ok = 1;
  string error = 2;
  optional RuledEventBatch batch = 3;
  // Oracle names the registry does not implement, sorted and deduplicated. Filled by
  // ValidateDeck and by a SessionStart that fails name resolution; empty otherwise.
  repeated string missing_card_names = 4;
  // Version handshake, filled on a successful SessionStart response. engine_build is the
  // sidecar's build id; card_data_hash is a stable hash of its embedded card data.
  // Servatrice logs both and stamps card_data_hash into the replay so
  // (seed, command log, data hash) reproduces the game. Empty on a sidecar that predates
  // the handshake (treated as a build-skew warning, not a refusal).
  string engine_build = 5;
  string card_data_hash = 6;
}
