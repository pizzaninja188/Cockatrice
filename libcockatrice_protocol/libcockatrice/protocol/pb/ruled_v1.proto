message LegalActions {
  // Display-only prompt feed. Gameplay consumes hand_actions, never these strings.
  repeated string labels = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Valid targets per castable face of a hand card that needs a target. Key encodes both the
  // engine hand slot and the face index: key = (hand_slot << 8) | face_index. Single-face cards
  // use face 0 (key == hand_slot << 8); multi-face cards (split / MDFC) emit one entry per face
  // whose half targets, so clients can offer the chosen face's targets and not the union (CR
  // 709/712/715 — e.g. Fire targets "any target", Ice targets "any permanent").
  map<uint32, SpellTargets> valid_targets_by_hand_slot = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Per-activated-ability valid targets. Key = (permanent_id << 32 | ability_index).
  // Presence of a key means the ability at that index requires a target.
  map<uint64, SpellTargets> valid_targets_by_ability = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Count of this player's mana abilities that are currently undoable via UndoManaAbility (CR 605
  // float courtesy). Non-zero only while strictly inconsequential; clients show an Undo affordance
  // when > 0. Drops to 0 the moment mana is spent, a spell/ability is cast, or priority passes.
  uint32 undoable_mana_abilities = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // CR 508.1d: battlefield creatures this player MUST declare as attackers this combat ("attacks
  // if able" — untapped, not summoning-sick unless Haste, non-Defender, with a defending player).
  // Populated only for the active player during declare-attackers, before attackers are locked in.
  // The engine rejects a declaration that omits any of these, so clients disable the confirm-
  // attackers control until every id is among the staged attackers (mirrors set_attackers).
  repeated uint32 required_attacker_ids = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // CR 509.1c: battlefield creatures this player MUST declare as blockers this combat ("blocks if
  // able" — untapped and able to legally block at least one declared attacker). Populated only for
  // the defending player after attackers are declared and before blocks are locked in. Clients
  // disable the confirm-blockers control until every id is staged as a blocker (mirrors set_blockers).
  repeated uint32 required_blocker_ids = 7 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated LegalHandAction hand_actions = 8 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  reserved 9, 10, 12;
  reserved "graveyard_actions", "valid_targets_by_graveyard_index", "selectable_blocker_ids";
  // Battlefield creatures the active player may currently stage as attackers. Populated only
  // while that player is making the declaration; derived from the same legality predicate used
  // by DeclareAttackers, so restrictions such as Defender and Pacifism are reflected in the UI.
  repeated uint32 selectable_attacker_ids = 11 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated LegalZoneCastAction zone_cast_actions = 13 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Valid targets for public-zone casts. Key = (engine ObjectId << 8) | face index.
  map<uint64, SpellTargets> valid_targets_by_zone_object = 14
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Per activated ability, keyed as (permanent_id << 32 | ability_index). The engine publishes
  // exact selectable objects for discard / filtered-sacrifice cost components.
  map<uint64, LegalCostChoices> cost_choices_by_ability = 15
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Exact blocker -> attacker assignments the defending player may currently stage. Each pair is
  // derived from the same legality predicate used by DeclareBlockers, so pair-specific evasion and
  // restrictions are reflected without client-side rules inference.
  repeated BlockPair legal_block_pairs = 16 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Key = (permanent_id << 32 | ability_index), matching the other activated-ability maps.
  map<uint64, ManaPaymentEligibility> mana_payment_by_ability = 17 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated LegalPermanentAction permanent_actions = 18 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated LegalZoneAbilityAction zone_ability_actions = 19
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated LegalZoneLandAction zone_land_actions = 20
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated ExilePlayPermissionGroup exile_play_permission_groups = 21
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Exact attacker/defender edges the active player may stage. A client selects one published
  // edge per staged attacker and never infers Battle protection or planeswalker control.
  repeated AttackAssignment legal_attack_assignments = 22
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// Servatrice-injected each ruled broadcast: engine hand slot index -> Server_Card.id for that player,
