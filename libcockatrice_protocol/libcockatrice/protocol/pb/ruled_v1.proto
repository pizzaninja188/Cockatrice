message RuledEvent {
  reserved 18;
  reserved "damage_order_assigned";
  oneof ev {
    PhaseChanged phase_changed = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    PriorityChanged priority_changed = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    StackPushed stack_pushed = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    StackResolved stack_resolved = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    SbasApplied sbas_applied = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    GameSnapshot snapshot = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    ReplayState replay_state = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    LogMessage log = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    ZoneViewSync zone_view = 9 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    PermanentMoved permanent_moved = 10 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    LifeChanged life_changed = 11 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    BattlefieldObjectMap battlefield_object_map = 12 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    AttackersDeclared attackers_declared = 13 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    HandSlotMap hand_slot_map = 14 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
    // After a successful DeclareBlockers (or defender pass = no blocks). Same BlockPair
