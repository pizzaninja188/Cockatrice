    BlockersDeclared blockers_declared = 15 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Servatrice-synthesized from PreviewDeclareBlockers; not emitted by the engine.
    BlockersPreview blockers_preview = 16 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Servatrice-synthesized from PreviewDeclareAttackers; not emitted by the engine.
    AttackersPreview attackers_preview = 17 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Engine-emitted after active player assigns combat damage for a multiply-blocked attacker.
    CombatDamageAssigned combat_damage_assigned = 19 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Engine-emitted when a triggered ability fires and needs the controller to choose a target
    // before the ability is placed on the stack (CR 603.3d).
    TriggerNeedsTarget trigger_needs_target = 20 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Engine-provided card identity map for the session's decks; emitted once in the
    // SessionStart response batch. Server-only (enumerates deck contents): Servatrice
    // strips it from client broadcasts alongside zone_view private fields.
    CardCatalog card_catalog = 21 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
    // A token came into existence on the battlefield (CR 111). The relay creates a physical
    // token card from the inline identity (tokens have no deck card / CardCatalog entry).
    TokenCreated token_created = 22 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // A tier-3 custom resolution paused and needs a player to choose among candidates (CR 608).
    // Generic across every custom card; the client renders it as an ordered/multi-select pick.
    ResolutionChoiceRequired resolution_choice_required = 23 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // A player's mana pool changed (CR 106): engine-authoritative pool after a mana ability
    // produced mana, a cost was paid, or the pool emptied on a step/phase change. The relay
    // mirrors it onto that player's ruled mana-pool counters (Event_SetCounter).
    ManaPoolUpdated mana_pool_updated = 24 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // An Aura permanent entered the battlefield and attached to an enchanted permanent (CR 303.4).
    // The relay translates this into Event_AttachCard so the client stacks the aura under the
    // enchanted permanent. Also emitted on zone-view reconnect to restore the attachment.
    AuraAttached aura_attached = 25 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // One or more creatures were removed from combat mid-step (CR 701.19a: regeneration; also
    // covers future tap-out-of-combat effects). Clients remove the corresponding arrows.
    CreaturesRemovedFromCombat removed_from_combat = 26 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Server-built graveyard OID map (parallel to battlefield_object_map) so clients can
    // resolve ReturnFromGraveyard valid_graveyard_ids to physical CardItems.
    GraveyardObjectMap graveyard_object_map = 27 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // A Transform/Flip layout permanent changed its active face (CR 710/712.8). The relay
    // updates the client's card face display. face_up_index 0 = front, 1 = back.
    FaceChanged face_changed = 28 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // A dev command conjured a card that was in no decklist, so the relay must create the
    // backing Server_Card. Server-only: no client ever receives it, which is what keeps
    // conjuring into a hand from leaking the card name to the opponent.
    DevCardConjured dev_card_conjured = 29 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
    // Permanents that became untapped during this batch (CR 701.20). Authorizes the relay to
    // apply the engine's untapped state for exactly these objects.
    PermanentsUntapped permanents_untapped = 30 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Two or more triggered abilities controlled by one player triggered simultaneously, and that
    // player chooses the order they go on the stack (CR 603.3b). Cross-player order is APNAP-fixed
    // and never prompted, so one event covers exactly one player's own block; the next player's
    // block (if any) raises its own event once this one is answered.
    TriggerOrderRequired trigger_order_required = 31 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Server-built exile OID map so an Adventure card click resolves to its exact engine object.
    ExileObjectMap exile_object_map = 32 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Server-built controller-private display identity for face-down battlefield objects.
    FaceDownObjectMap face_down_object_map = 33 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
    // The named stack object was countered and no longer exists on the stack. Unlike
    // StackResolved, this event has no destination semantics: physical spell movement is
    // published separately as PermanentMoved, while abilities and copies simply disappear.
    StackObjectCountered stack_object_countered = 34 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Exact snapshot of hand cards intentionally revealed as active cast costs. The engine emits
    // this on every authoritative batch, including an empty snapshot.
    ActivePublicRevealSnapshot active_public_reveal_snapshot = 35
        [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // One or more creatures entered the battlefield attacking after attackers were declared.
    // Clients append these generation-bound edges; they must not replace the declared cohort.
    AttackersAdded attackers_added = 36 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  }
}

// One triggered ability that has fired and is waiting to be put on the stack. It is not on the
// stack yet and has no physical card, so it is self-describing rather than an id the client can
// look up: `trigger_object_id` is an engine ObjectId reserved when the trigger was collected, which
// becomes this trigger's StackPushed.object_id once it is placed. That is the handle
// SubmitTriggerOrder echoes back, and seeing it in StackPushed is how a client knows the prompt is
// finished.
message TriggerOrderCandidate {
  uint32 trigger_object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // The source permanent. Usually still on the battlefield, so the client can show its CardItem —
  // but NOT guaranteed: a dies trigger's source left in the same event (CR 603.6/603.10).
  uint32 source_permanent_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 ability_index = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Oracle display name of the source — the same value StackPushed.description carries — so a
  // trigger whose source has already left the battlefield still renders.
  string source_card_name = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string ability_text = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  PresentationRef ability_presentation = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// A player must choose which of their simultaneous triggered abilities goes on the stack next
// (CR 603.3b). Public in full: which abilities triggered is public information — only the *choice*
// belongs to deciding_player_id, and no candidate here exposes a concealed zone. Opponents use it
// for a "waiting" indicator.
//
// Re-emitted after each placement with the triggers that are still unplaced, so `candidates` is
// always the *remaining* set and always has at least 2 entries (with one left there is no choice,
// and the engine places it itself).
message TriggerOrderRequired {
  int32 deciding_player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // In engine (APNAP-stable) order.
  repeated TriggerOrderCandidate candidates = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Permanents that *became untapped* (CR 701.20) while this batch's command was applied — the
// edge, not the state: a permanent that was already untapped is never listed. Emitted by every
// untap path the engine has (the untap step, untap effects such as Seeker of Skybreak and
// Vitalize, and the CR 605 mana-ability undo).
//
// Servatrice needs the edge because the engine's zone view alone is not enough: a ruled player
// holding priority may still tap their own permanents manually through the legacy SetCardAttr
// path, so the relay refuses to push engine untaps onto the client mid-turn rather than stomp
// those. This event names the objects the engine genuinely untapped, which the relay honors
// unconditionally.
message PermanentsUntapped {
  repeated uint32 object_ids = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// A dev command minted a card from outside the game (see DevPutCardInZone). Servatrice creates
// the backing Server_Card and pre-registers the engine-oid binding before the zone-view sync
// later in the same batch, which would otherwise find no physical card and abandon the reconcile.
// Clients learn about the card through the ordinary redacted zone-view/game-state resync.
message DevCardConjured {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  int32 owner_player_id = 2 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // Oracle display name for the physical Server_Card.
  string card_name = 3 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // Only DEV_ZONE_HAND and DEV_ZONE_BATTLEFIELD are emitted.
  DevZone zone = 4 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // Battlefield row placement, mirroring TokenIdentity.is_creature.
  bool is_creature = 5 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

// Public, engine-authored identity of the object or player an Aura is attached to.
message AttachmentRecipient {
  oneof recipient {
    uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    int32 player_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  }
}

// An Aura spell resolved and attached to an object or player (CR 303.4).
message AuraAttached {
  uint32 aura_object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  reserved 2;
  reserved "enchanted_object_id";
  AttachmentRecipient attachment_recipient = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// A permanent changed its active face (CR 710/712.8: transform does not trigger ETB).
message FaceChanged {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 controller_player_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 face_up_index = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool face_down = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Engine-authoritative mana pool snapshot for one player (CR 106). Absolute counts (not deltas),
// so the relay can set the client's mana-pool counters directly. Emitted whenever a pool changes.
message ManaPoolUpdated {
  int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 w = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 u = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 b = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 r = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 g = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 c = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated RestrictedManaGroup restricted_groups = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message RestrictedManaGroup {
  uint32 restriction_group_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 w = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 u = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 b = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 r = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 g = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 c = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string display_label = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  PresentationRef presentation = 9 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// What the candidate object ids of a ResolutionChoiceRequired refer to, so the client can present
// them correctly and — crucially — so Servatrice knows which ones expose a concealed zone. The
// private kinds (HAND_CARDS, LIBRARY_SEARCH, OPPONENT_HAND, LIBRARY_TOP, LIBRARY_LOOK, and
// MANIFEST_DREAD) are redacted from
// every player but the decider; see isPrivateChoiceKind() next to the relay's redaction pass.
enum ChoiceKind {
  // Cards in the deciding player's own hand (Brainstorm: pick 2 to put back). Private.
  CHOICE_KIND_HAND_CARDS = 0;
  // Cards revealed to the table during resolution (Gifts Ungiven: opponent picks 2 of the
  // revealed set). Public — everyone already saw them.
  CHOICE_KIND_REVEALED = 1;
  // Cards the deciding player is searching out of their own library (Demonic Tutor, Gifts
  // Ungiven's search step). Private — the library stays hidden; only the chosen cards go public.
  CHOICE_KIND_LIBRARY_SEARCH = 2;
  // Target objects: battlefield permanents, stack spells, or players (CR 707.10c copy retarget).
  // Public; the client uses click-to-target mode instead of a list dialog for this kind.
  CHOICE_KIND_TARGET_OBJECTS = 3;
  // Cards in *another* player's hand, revealed privately to the deciding player
  // (Thoughtseize/Coercion "look at target player's hand" — CR 701.7 "look" does not reveal the
  // hand to the table). Private; rendered by the client exactly like CHOICE_KIND_REVEALED.
  CHOICE_KIND_OPPONENT_HAND = 4;
  // Legend-rule keep (CR 704.5j): battlefield permanents the deciding player controls, one of
  // which is kept and the rest sacrificed. Public; like TARGET_OBJECTS the client uses
  // click-to-select on the battlefield instead of a list dialog.
  CHOICE_KIND_LEGEND_KEEP = 5;
  // The top N cards of the deciding player's own library, looked at but not moved out of the
  // library (CR 701.18 scry: Preordain, Opt). Emitted twice per scry when the player keeps more
  // than one card on top — first to pick the ones going to the bottom (min 0), then ordered to
  // arrange the rest. Private, and rendered by the client like CHOICE_KIND_LIBRARY_SEARCH: the
  // relay has no Server_Card ids for library cards and substitutes sequential indices.
  CHOICE_KIND_LIBRARY_TOP = 6;
  // CR 616 ordering among applicable replacement and prevention effects. Candidate ids are
  // opaque application ids, not game objects. Public; candidate_names carry descriptions.
  CHOICE_KIND_REPLACEMENT_EFFECT = 7;
  // A live battlefield permanent selected as an untargeted copy source (Clone, Stunt Double,
  // Populate). Public; min=0 permits declining, while min=1 requires a source.
  CHOICE_KIND_COPY_SOURCE = 8;
  // A public resolution-time generic-mana payment. The decider receives the prompt; other players
  // receive the ordinary waiting state. No candidate objects are exposed for this choice.
  CHOICE_KIND_MANA_PAYMENT = 9;
  // Opaque, engine-authored resolution branches rendered as labeled prompt buttons.
  CHOICE_KIND_RESOLUTION_BRANCH = 10;
  // A bounded top-of-library window the deciding player looks at. Unlike LIBRARY_TOP scry,
  // every looked-at card is displayed while candidate_selectable says which card images may be
  // chosen. Private, and rendered through the deck-zone card-image popup rather than a text list.
  CHOICE_KIND_LIBRARY_LOOK = 11;
  // CR 701.62 manifest dread: exactly one of the top two cards is chosen to manifest. Private,
  // rendered through the deck-zone card-image popup without library-search sorting controls.
  CHOICE_KIND_MANIFEST_DREAD = 12;
  // Cards from one or more of the deciding player's hand, graveyard, and library. Private because
  // the cohort may expose hidden hand/library contents even when some candidates are public.
  CHOICE_KIND_ZONE_SEARCH = 13;
  // Cards selected from the deciding player's public graveyard during resolution. Kept private
  // while pending so only the deciding participant receives selectable metadata.
  CHOICE_KIND_GRAVEYARD_CARDS = 14;
  // CR 303.4f: an Aura entering from a zone other than the stack needs its owner to choose a
  // legal permanent to enchant. Public battlefield object ids; answered by clicking the board.
  CHOICE_KIND_AURA_PERMANENT = 15;
  // The player-recipient counterpart (Curses and other "enchant player" Auras). Candidate ids are
  // PlayerIds in the public player-click domain, kept distinct from battlefield ObjectIds.
  CHOICE_KIND_AURA_PLAYER = 16;
  // CR 310.11a / 704.5w-x: choose an opponent to protect a Siege.
  CHOICE_KIND_BATTLE_PROTECTOR = 17;
  // CR 310.11b: optionally cast the defeated Siege transformed from exile.
  CHOICE_KIND_SIEGE_CAST = 18;
  // CR 508.4: choose the player, planeswalker, or Battle a token enters attacking. Public domain,
  // but the exact candidate snapshot is routed only to the deciding player.
  CHOICE_KIND_ATTACKING_TOKEN_DEFENDER = 19;
  // Untargeted battlefield objects selected to pay a resolving authored cost. The candidate
  // snapshot is private to the deciding player even though accepted taps become public state.
  CHOICE_KIND_COST_OBJECTS = 20;
  // Public battlefield permanents chosen during resolution without targeting (CR 608.2d).
  // Final Showdown and source-selection effects such as Sakashima's Will use this click surface.
  CHOICE_KIND_PERMANENT_OBJECTS = 21;
}

enum ChoiceCandidateSourceZone {
  CHOICE_CANDIDATE_SOURCE_ZONE_UNSPECIFIED = 0;
  CHOICE_CANDIDATE_SOURCE_ZONE_HAND = 1;
  CHOICE_CANDIDATE_SOURCE_ZONE_GRAVEYARD = 2;
  CHOICE_CANDIDATE_SOURCE_ZONE_LIBRARY = 3;
}

// Whether a concealed-zone cohort attached to a resolution choice is merely looked at by the
// deciding player or is publicly revealed for the lifetime of that choice. This is deliberately
// independent of ChoiceKind: OPPONENT_HAND covers both Cracked Skull's private "look" and
// Coercion's public "reveal" semantics.
enum ResolutionRevealAudience {
  RESOLUTION_REVEAL_AUDIENCE_NONE = 0;
  RESOLUTION_REVEAL_AUDIENCE_ALL_PARTICIPANTS = 1;
}

enum ResolutionBranchCostKind {
  RESOLUTION_BRANCH_COST_KIND_UNSPECIFIED = 0;
  RESOLUTION_BRANCH_COST_KIND_MANA = 1;
  RESOLUTION_BRANCH_COST_KIND_DISCARD_CARD = 2;
  RESOLUTION_BRANCH_COST_KIND_SACRIFICE_PERMANENT = 3;
  RESOLUTION_BRANCH_COST_KIND_TAP_PERMANENTS = 4;
  RESOLUTION_BRANCH_COST_KIND_BLIGHT = 5;
  RESOLUTION_BRANCH_COST_KIND_WATERBEND = 6;
}

message ResolutionBranchOption {
  uint32 branch_index = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  string label = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  ResolutionBranchCostKind cost_kind = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  string cost_text = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  bool selectable = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Nonempty only when this branch represents one engine-authored combination of searchable
  // zones. Clients render the union as checkboxes and map the checked set back to branch_index;
  // labels remain display-only and are never parsed for legality.
  repeated ChoiceCandidateSourceZone search_zones = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  PresentationRef presentation = 7 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// One engine-authored capacity in a heterogeneous concealed-zone search. Candidate indices refer
// to ResolutionChoiceRequired.candidate_object_ids; card identities are never duplicated here.
message ResolutionSelectionSlot {
  string label = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated uint32 candidate_indices = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  PresentationRef presentation = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// A parked custom resolution (CR 608) requesting input from one player. Reused by every tier-3
// card (and later X-spells / modal spells) — the engine is the sole source of the candidate set,
// so clients never replicate selection logic from Oracle text. The deciding player may be the
// opponent of the spell's controller (Gifts Ungiven).
message ResolutionChoiceRequired {
  // Engine PlayerId who must answer; only that player's client prompts.
  int32 deciding_player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // The in-flight spell's object id (the stack object being resolved), for display/context.
  uint32 source_object_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Display-only prompt (server-only; the relay does not look up Oracle text for this).
  string prompt_text = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // What the candidate ids refer to (see ChoiceKind for the per-value semantics and which
  // kinds Servatrice redacts). Wire-identical to the untyped int32 this used to be.
  ChoiceKind choice_kind = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Candidate object ids to choose among (engine ObjectIds).
  repeated uint32 candidate_object_ids = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Parallel to candidate_object_ids: tricerules card id for each candidate, so the relay/client
  // can show names (resolve to Oracle names via CardCatalog) without an oid->card lookup.
  repeated string candidate_card_ids = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Inclusive bounds on how many candidates must be chosen.
  uint32 min = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 max = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // True when the chosen order is significant (Brainstorm: order cards put back on top).
  bool ordered = 9 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Parallel to candidate_object_ids: each candidate's display (Oracle) name, so the deciding
  // player's client renders the choice without a card-id lookup. For CHOICE_KIND_HAND_CARDS
  // these are private; Servatrice redacts candidate_* for everyone but the deciding player.
  repeated string candidate_names = 10 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Parallel to candidate_object_ids: Servatrice's physical card id (Server_Card::getId()) for
  // each candidate, injected by the relay. HAND_CARDS uses real physical ids only for the owning
  // recipient. Concealed-zone popup cohorts use transient sequential ids scoped to this snapshot;
  // these are never another player's persistent hand-card ids.
  repeated int32 candidate_server_card_ids = 11 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // When true, all chosen candidates must have distinct card names (Gifts Ungiven: "four cards
  // with different names"). The client enforces this before submission; the engine re-validates.
  bool unique_names = 12 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Generic mana requested by a CHOICE_KIND_MANA_PAYMENT choice. Zero for object choices.
  uint32 generic_mana_cost = 13 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Engine-authoritative affordability for a mana payment. Clients must not recompute this.
  bool payment_currently_legal = 14 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated ResolutionBranchOption resolution_branches = 15 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Canonical brace cost for colored resolution payments. Empty for generic-only legacy
  // soft-counter payments and nonmana choices.
  string mana_cost = 16 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Parallel to candidate_object_ids. Empty means every candidate is selectable (the legacy
  // contract); otherwise the vector must have exactly the same length. This lets an engine show
  // every card in a looked-at library window while keeping matching-card legality authoritative.
  repeated bool candidate_selectable = 17 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Engine-authored visibility for the concealed-zone cohort. NONE is fail-closed and preserves
  // chooser-private look/search behavior. ALL_PARTICIPANTS authorizes the relay to route the
  // transient candidate identities to every player and spectator for this pending choice only.
  ResolutionRevealAudience reveal_audience = 18 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Owner of the hidden zone being publicly revealed. Present only when reveal_audience is
  // ALL_PARTICIPANTS; absence must never be inferred from targets or Oracle display data.
  optional int32 revealed_zone_owner_player_id = 19 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Parallel to candidate_object_ids for multi-zone cohorts. Empty remains valid for legacy
  // single-zone kinds; malformed nonempty vectors fail closed in relay and client consumers.
  repeated ChoiceCandidateSourceZone candidate_source_zones = 20 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  repeated CombatDefenderOption combat_defender_options = 21
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  bool waterbend = 22 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // Empty for homogeneous picks. Nonempty is a bipartite eligibility graph that the existing
  // picker uses to reject selections which cannot occupy distinct authored slots.
  repeated ResolutionSelectionSlot selection_slots = 23
      [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// A token entered the battlefield (CR 111). Unlike a resolved permanent spell, a token has no
// physical card in any deck/hand/stack and no Oracle cards.xml entry, so it is self-describing:
// the relay builds a token Server_Card from `identity` and binds it to `object_id`.
message TokenCreated {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 controller_player_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Engine definition/provenance id. Copied tokens may share an id with a real card or have
  // no registry definition; token status and physical creation are conveyed by this event.
  string card_id = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  TokenIdentity identity = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // True when the creation instruction puts this token onto the battlefield tapped.
  bool enters_tapped = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Self-describing token characteristics for the relay and client (tokens are absent from the
// Oracle card database and the session CardCatalog). Public once the token is on the battlefield.
message TokenIdentity {
  string name = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];            // e.g. "Soldier"
  string pt = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];              // "1/1" for creatures; empty for noncreature tokens
  string color = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];           // Cockatrice color string, lowercase wubrg; empty = colorless
  repeated string types = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];  // e.g. ["Creature", "Soldier"]
  bool is_creature = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Static keyword abilities, MTG spelling (e.g. ["Flying"], ["Lifelink"]). Lets the client pick
  // the matching Oracle token art among same-name variants (e.g. vanilla vs. vigilance Knight).
  repeated string keywords = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Oracle-style text for printed non-keyword abilities. This is display identity, not a client
  // rules source; the engine remains authoritative for every ability's behavior.
  repeated string ability_texts = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// The single source of card identity for a ruled session: Servatrice sends Oracle names
// into the engine and maps every engine card_id (zone views, stack pushes, object maps)
// back to a name through this catalog — no name->id derivation happens in C++.
message CardCatalog {
  message Entry {
    string card_id = 1 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];        // engine id, e.g. "lightning_bolt" or "fire_ice"
    string name = 2 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];           // whole-card Oracle name, e.g. "Lightning Bolt" / "Fire // Ice"
    repeated string types = 3 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY]; // from CardDefinition.types (primary face for multi-face cards)
    bool is_permanent = 4 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];     // CR 110.4: resolves to the battlefield, not the graveyard
    // CR 709/712/715: per-face Oracle names in face order (e.g. ["Fire", "Ice"]). Empty for
    // single-face cards. These are labels and lookup aliases; not every face is a standalone
    // cards.xml entry (Adventure and split cards use the whole-card name there).
    repeated string face_names = 5 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
    // Exact cards.xml CardRef name for each face. Transform, flip, and modal DFC faces have
    // separate entries; Adventure and split faces repeat the whole-card name. This keeps physical
    // card hover details resolvable without asking the display database for rules information.
    repeated string face_display_names = 6 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  }
  repeated Entry entries = 1 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

message CombatDamageAssigned {
  uint32 attacker_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated DamagePair assignments = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Where the engine is in the turn structure (CR 500-514), plus the fork's two opening-procedure
// pseudo-phases. Emitted by the engine and mapped by both C++ consumers; it replaces the free
// phase-label string that used to be hand-parsed in three places. Values are ordered by when they
// occur in a turn (the numbering carries no other meaning — never do arithmetic on it).
enum PhaseId {
  PHASE_ID_UNSPECIFIED = 0;
  // Opening procedure (CR 103), before the first turn: the randomly chosen player picks who goes
  // first, then each player takes London mulligans.
  PHASE_ID_OPENING_CHOOSE_FIRST = 1;
  PHASE_ID_OPENING_MULLIGAN = 2;
  PHASE_ID_UNTAP = 3;
  PHASE_ID_UPKEEP = 4;
  PHASE_ID_DRAW = 5;
  PHASE_ID_MAIN1 = 6;
  PHASE_ID_BEGIN_COMBAT = 7;
  PHASE_ID_DECLARE_ATTACKERS = 8;
  PHASE_ID_DECLARE_BLOCKERS = 9;
  // CR 510.1a: the active player is assigning one multiply-blocked attacker's combat damage.
  // Not a CR step of its own — a fork-side pause inside the combat damage step.
  PHASE_ID_ASSIGN_COMBAT_DAMAGE = 10;
  // CR 510.4: the extra combat damage step created by first/double strike. Shares the Cockatrice
  // "Combat Damage Step" toolbar slot with PHASE_ID_COMBAT_DAMAGE.
  PHASE_ID_FIRST_STRIKE_DAMAGE = 11;
  PHASE_ID_COMBAT_DAMAGE = 12;
  PHASE_ID_END_COMBAT = 13;
  PHASE_ID_MAIN2 = 14;
  PHASE_ID_END_STEP = 15;
  // CR 514. The engine does not announce cleanup today (clients keep highlighting the end step
  // through it); the value exists so a cleanup-visible change needs no proto edit.
  PHASE_ID_CLEANUP = 16;
}

message PhaseChanged {
  // Was `string phase`, a free label re-parsed by the relay and the client independently.
  reserved 1;
  reserved "phase";
  int32 active_player_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  PhaseId phase_id = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message PriorityChanged {
  int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message StackPushed {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string description = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Chosen targets for this spell/ability while it is on the stack (object ids; player targets
  // use the engine's PlayerId as object_id, same as CastSpell.targets).
  repeated TargetRef targets = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Text the client overlays on the stack card as an annotation: the ability text for
  // activated/triggered abilities, "X = N" for an X spell (CR 107.3), or the cast face name of a
  // multi-face spell (e.g. "Fire" / "Ice"). Empty for ordinary single-face spells. card_id (below)
  // distinguishes a spell (non-empty: the physical card is already on the stack and only the
  // annotation is overlaid) from an ability (empty: the client builds a synthetic stack card).
  string ability_annotation = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Engine card id of the pushed spell (e.g. "lightning_bolt"); empty for abilities,
  // which have no physical card on the stack. Resolve to an Oracle name via CardCatalog.
  string card_id = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // True when this stack item is a *triggered* ability rather than an activated one. Both have an
  // empty card_id, so the client cannot tell them apart otherwise — and it must, because a
  // triggered ability arriving on the stack is what tells it a pending trigger-target prompt has
  // been answered. An activated ability (Bottle Gnomes' sacrifice) must not clear that prompt.
  bool is_triggered = 10 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // CR 707.10: true when this stack item is a *copy* of a spell (Twincast/Fork), not a cast
  // object. Like an ability it has no physical card on the shared stack; the client shows it via
  // card_id + the "(copy)" ability_annotation and expects no permanent/graveyard card on resolve.
  bool is_copy = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // For copies (is_copy == true): the object_id of the original stack item being copied. The
  // client uses this to inherit the original spell's Oracle printing (set/provider) so the copy
  // displays the same card art instead of defaulting to the newest printing.
  uint32 copy_source_object_id = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Public modal choices in printed order. Indices are stable rules identity; labels are
  // display metadata so clients never reconstruct Oracle-mode text.
  repeated uint32 chosen_mode_indices = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated string chosen_mode_labels = 9 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated string chosen_cast_cost_labels = 11 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Public display identity captured before an activated ability's token source pays its costs.
  // The source may be sacrificed (Clue/Lander), so the synthetic stack card cannot recover this
  // metadata from the battlefield after the ability has been pushed.
  TokenIdentity source_token_identity = 12 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  PresentationRef primary_presentation = 13 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated PresentationRef chosen_mode_presentations = 14 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated PresentationRef chosen_cast_cost_presentations = 15 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message ActivePublicReveal {
  uint32 source_stack_object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 group_index = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 revealing_player_id = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string source_description = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string card_id = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string card_name = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message ActivePublicRevealSnapshot {
  repeated ActivePublicReveal reveals = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message ActivateAbility {
  uint32 source_object_id = 1; // ObjectId of the physical source object
  uint32 ability_index = 2;    // Index into card's activated_abilities list
  repeated TargetRef targets = 3;
  // CR 107.4: per-pip payment choices for flexible mana in the ability cost (see CastSpell).
  repeated FlexPipPayment flex_payments = 4;
  // CR 605: for a mana ability with multiple producible options (e.g. a dual land), which
  // option to produce — index into the ability's ProduceMana `options`. The choice is made at
  // activation because mana abilities don't use the stack (CR 605.3b). 0 (default) for
  // single-option mana abilities and all non-mana abilities.
  uint32 mana_option_index = 5;
  // Explicit choices for authored cost components. `cost_index` indexes the ability's ordered
  // cost list; each component that requires a choice appears exactly once.
  repeated CostSelection cost_selections = 6;
  repeated ManaSpendSelection restricted_mana = 7;
  AbilitySourceZone source_zone = 8;
  uint64 expected_zone_change_generation = 9;
  PaymentSelection payment = 10;
}

message ExecutePermanentAction {
  PermanentActionKind kind = 1;
  uint32 object_id = 2;
  uint64 expected_zone_change_generation = 3;
  optional uint32 face_index = 4;
  repeated FlexPipPayment flex_payments = 5;
  repeated ManaSpendSelection restricted_mana = 6;
}

message CostSelection {
  uint32 cost_index = 1;
  oneof selection {
    uint32 hand_index = 2;
    uint32 permanent_id = 3;
    GraveyardObjectIds graveyard_object_ids = 4;
    CostObjectRefs battlefield_objects = 5;
    CounterRemovalSelection counter_removal = 6;
  }
}

message GraveyardObjectIds {
  repeated uint32 object_ids = 1;
}

message ChooseTriggerTarget {
  reserved 1;
  // CR 603.5: decline an optional triggered ability. When true, targets is ignored.
  bool decline = 2;
  repeated TargetRef targets = 3;
  // Triggered modes chosen while putting the ability on the stack (CR 603.3c).
  repeated SelectedSpellMode selected_modes = 4;
}

message TriggerNeedsTarget {
  uint32 source_permanent_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 ability_index = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string ability_text = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];     // Oracle text of the triggered ability (shown in prompt widget)
  int32 controller_player_id = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC]; // PlayerId of the player who controls the trigger
  bool may_decline = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC]; // CR 603.5: "you may"
  SpellTargets targets = 6 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  uint32 min_modes = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 max_modes = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated LegalSpellMode modes = 9 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  PresentationRef ability_presentation = 10 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Where the resolved spell object ends up (Servatrice maps this to TABLE vs GRAVE).
enum StackResolveDestination {
  STACK_RESOLVE_DESTINATION_UNSPECIFIED = 0; // legacy: server may infer from Oracle text
  STACK_RESOLVE_DESTINATION_GRAVEYARD = 1;
  STACK_RESOLVE_DESTINATION_BATTLEFIELD = 2;
  STACK_RESOLVE_DESTINATION_EXILE = 3; // CR 702.34: a spell cast with flashback
  STACK_RESOLVE_DESTINATION_LIBRARY = 4; // CR 720.3d: a successfully resolving Omen
}

message StackResolved {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  StackResolveDestination destination = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // CR 108.3/400.3: destination seat for a physical spell card. Absent for abilities and copies.
  optional int32 owner_player_id = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message StackObjectCountered {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message SbasApplied {
  string description = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// One activated ability on a battlefield permanent, in registry order. Keeping each property
// structured avoids a second delimiter-based protocol inside protobuf.
message AbilityInfo {
  string text = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string mana_cost = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string mana_produced = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string cost_label = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // False when this ability cannot be activated right now for a reason no amount of mana fixes:
  // its tap cost is unavailable (already tapped, or CR 302.6 summoning sickness), or it is an
  // equip ability outside a sorcery-speed window (CR 702.6a). The client must not offer it —
  // otherwise it opens the activation menu and collects mana for a command the engine rejects.
  // Mana affordability is deliberately NOT folded in: mana is floated after the ability is chosen.
  bool activatable = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  PresentationRef presentation = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message BattlefieldObject {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string card_id = 2 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  bool tapped = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool summoning_sick = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool is_creature = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 power = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 toughness = 7 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 damage = 8 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Effective Keyword variant names (e.g. "Haste", "FirstStrike"). Adding a keyword does not
  // require a protobuf field or synchronized relay/client boolean.
  repeated string keywords = 9 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated AbilityInfo activated_abilities = 10 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string counters_annotation = 11 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  reserved 12;
  reserved "attached_to_oid";
  uint32 face_up_index = 13 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // CR 108.3 owner. The engine-authored per-player view is the control index; Servatrice may
  // project a Battle onto its protector's physical table, so controller_player_id below preserves
  // that distinct rules identity through the display projection.
  int32 owner_player_id = 14 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Canonical engine-authored display labels for nonintrinsic rules state on this permanent
  // (e.g. ["Deathtouch", "Can't be blocked"]). The relay renders these as one replaceable
  // annotation line; relay and client code must not infer them from the Oracle display database.
  repeated string rules_annotation_labels = 15 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Engine-owned effective display identity after CR 613 layer 1. The relay may use cards.xml to
  // render this name, but must not infer rules characteristics from it.
  string effective_display_name = 16 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Replaceable compact annotation describing the underlying physical object (e.g. "Copy: Clone").
  string copy_annotation = 17 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  AttachmentRecipient attachment_recipient = 18 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool face_down = 19 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint64 zone_change_generation = 20 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated RoomDoorState room_doors = 21 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Effective land type after CR 613 characteristics. Servatrice consumes this to place the
  // physical card in Cockatrice's land row; clients receive the resulting table coordinates.
  bool is_land = 22 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  bool is_planeswalker = 23 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool is_battle = 24 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 loyalty = 25 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint32 defense = 26 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  optional int32 battle_protector_player_id = 27 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  optional int32 controller_player_id = 28 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message RoomDoorState {
  uint32 face_index = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  string name = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool unlocked = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message HandCard {
  string card_id = 1 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  uint32 object_id = 2 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

message LibraryCard {
  string card_id = 1 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  uint32 object_id = 2 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

// Authoritative per-player zone view. Servatrice consumes the server-only concealed zones to
// synchronize physical cards, then the reflection redactor removes them from every client copy.
message RuledPerPlayerView {
  int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  reserved 2 to 27, 29;
  reserved "hand", "lib_ids_csv", "lib_ids", "battlefield", "battlefield_tapped",
           "battlefield_object_id", "battlefield_summoning_sick", "battlefield_power",
           "battlefield_toughness", "battlefield_damage", "battlefield_is_creature",
           "hand_object_id", "battlefield_haste", "battlefield_trample",
           "battlefield_first_strike", "battlefield_double_strike",
           "battlefield_activated_ability_texts", "battlefield_activated_ability_mana_costs",
           "battlefield_activated_ability_mana_produced",
           "battlefield_activated_ability_cost_labels", "battlefield_counters_annotation",
           "battlefield_attached_to_oid", "graveyard_object_id", "battlefield_face_up_index",
           "library_card_ids";
  repeated HandCard hand_cards = 28 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // Public permanents in controller order.
  repeated BattlefieldObject battlefield_objects = 30 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Engine ObjectIds in public graveyard order, used for target identity mapping.
  repeated uint32 graveyard_object_ids = 31 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Drives the distinct first-strike damage prompt within CR 510.4 combat damage processing.
  bool first_strike_step_pending = 32 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // This player's hand and library are identical to their previous view in this session, so
  // `hand_cards` and `library_cards` above are omitted and the receiver keeps what it has.
  // Same absent-means-unchanged contract as HandSlotMap. Never set on the first view of a
  // session (the startup sync needs a full snapshot to seed the physical zones), and decided
  // per player: a draw re-sends the drawing player in full while the other stays omitted.
  // Server-only, like the two concealed fields it describes.
  bool private_zones_unchanged = 33 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // Engine ObjectIds in public exile order, used for Adventure/source identity mapping.
  repeated uint32 exile_object_ids = 34 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Top of library first. Object identity, card identity, and order are server-only so the relay
  // can preserve exact physical cards through shuffles without revealing the hidden zone.
  repeated LibraryCard library_cards = 35 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

message ZoneViewSync {
  repeated RuledPerPlayerView per_player = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // Every player's battlefield is identical to the previous zone view in this session, so each
  // `battlefield_objects` list is omitted and the receiver keeps its complete prior battlefield.
  // Never set on the first view of a session. Unlike `private_zones_unchanged`, this is global:
  // any public battlefield change causes every player's battlefield to be sent in full.
  bool battlefields_unchanged = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message GameSnapshot {
  string summary = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message ReplayState {
  uint64 seed = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  uint64 command_index = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message LogMessage {
  string text = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  // If set, the relay delivers this message only to that player. Absent = broadcast to all.
  optional int32 visible_to_player_id = 2 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // If set, the relay drops this message for that player and delivers it to everyone else.
  optional int32 hidden_from_player_id = 3 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

// A permanent left the battlefield (currently only graveyard via SBAs / destroy effects).
// Servers translate this into a Cockatrice moveCard from TABLE to the destination zone.
message PermanentMoved {
  uint32 object_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 owner_player_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  enum Destination {
    DESTINATION_UNSPECIFIED = 0;
    DESTINATION_GRAVEYARD = 1;
    DESTINATION_HAND = 2;
    DESTINATION_LIBRARY = 3;
    DESTINATION_EXILE = 4;
    // Used by ReturnFromGraveyard with GraveyardDestination::Battlefield (reanimation).
    DESTINATION_BATTLEFIELD = 5;
  }
  Destination destination = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  // tricerules card id (lowercase_underscore). Lets servers resolve cards that
  // have no engine-oid mapping (e.g. milled library cards) by name within a zone.
  string card_id = 4 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
  // CR 110.2: the player whose battlefield the permanent lands under. Meaningful only for
  // DESTINATION_BATTLEFIELD; every other destination belongs to `owner_player_id` (CR 400.3).
  // **Always set by the engine**, and equal to `owner_player_id` whenever control does not
  // change — player id 0 is valid and proto3 scalars carry no presence, so a defaulted 0 could
  // not be told apart from "player 0 controls it".
  int32 controller_player_id = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  bool face_down = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  optional uint32 source_library_position = 7 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
}

// A player's life total changed. delta is signed (negative = loss).
message LifeChanged {
  int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 new_total = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  int32 delta = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Server-built mapping so clients can map graveyard CardItems to engine ObjectIds for
// ReturnFromGraveyard targeting. Sent alongside BattlefieldObjectMap whenever graveyard
// membership changes. Only engine_object_id and server_card_id are needed here (player_id
// is implicit from the zone the card is in on the client).
message GraveyardObjectMap {
  message Entry {
    int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    uint32 engine_object_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Server_Card.id for the graveyard card; -1 if unknown.
    int32 server_card_id = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  }
  repeated Entry entries = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Server-built mapping so clients and the relay can bind public exile cards to engine ObjectIds.
message ExileObjectMap {
  message Entry {
    int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    uint32 engine_object_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    int32 server_card_id = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  }
  repeated Entry entries = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Server-built mapping (not engine-emitted) so clients can map a CardItem (whose
// id is the Server_Card id on the wire) to the corresponding engine ObjectId.
// Sent alongside ruled batches whenever battlefield membership changes.
message BattlefieldObjectMap {
  message Entry {
    int32 player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    uint32 engine_object_id = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // tricerules card id (lowercase_underscore)
    string card_id = 3 [(field_visibility) = FIELD_VISIBILITY_SERVER_ONLY];
    // 0-based position within the controller's battlefield
    uint32 ordinal = 4 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // Server_Card.id for the same permanent on the Cockatrice side; -1 if unknown.
    int32 server_card_id = 5 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    // True if this permanent currently has summoning sickness.
    bool summoning_sick = 6 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    reserved 7, 8, 9;
    reserved "haste", "trample", "activated_ability_texts";
    // Oracle-style texts for each activated ability on this permanent, in index order.
    // Empty for permanents with no activated abilities. Used by clients to build the
    // activation context menu.
    // True if this permanent is a creature (engine-authoritative, from the tricerules
    // registry — NOT the Oracle display DB). Clients use this for combat eligibility so
    // engine-minted tokens (which have no Oracle entry) can be declared as attackers/blockers.
    bool is_creature = 10 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
    repeated string keywords = 11 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  }
  repeated Entry entries = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Servatrice-built and delivered only to the permanent's current controller. The physical table
// item remains face down; this map supplies local-only display identity and is never rules input.
message FaceDownObjectMap {
  message Entry {
    int32 controller_player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
    uint32 engine_object_id = 2 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
    uint64 zone_change_generation = 3 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
    int32 server_card_id = 4 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
    string card_name = 5 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
  }
  repeated Entry entries = 1 [(field_visibility) = FIELD_VISIBILITY_PER_PLAYER];
}

// Engine-emitted after a successful set_attackers; lists the attacking creatures
// so defenders' clients can highlight attackers (also drives Event_SetCardAttr
// (AttrAttacking) translation server-side).
message AttackersDeclared {
  int32 attacking_player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  reserved 2;
  reserved "attacker_object_ids";
  repeated AttackAssignment assignments = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message BlockersDeclared {
  repeated BlockPair block_pairs = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message BlockersPreview {
  int32 declaring_player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  repeated BlockPair block_pairs = 2 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

message AttackersPreview {
  int32 declaring_player_id = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
  reserved 2;
  reserved "attacker_object_ids";
  repeated AttackAssignment assignments = 3 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Engine-emitted for attackers that entered combat without being declared as attackers (CR
// 508.4). This is intentionally additive so the declared-attacker snapshot and previews remain
// intact while clients add arrows and blocker eligibility for the new objects.
message AttackersAdded {
  repeated AttackAssignment assignments = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// Engine-emitted when one or more creatures are removed from combat mid-step (CR 701.19a).
// Covers regeneration and any future effect that taps or otherwise ejects a creature from combat.
// Clients remove the corresponding attacker/blocker arrows for the listed engine object ids.
message CreaturesRemovedFromCombat {
  repeated uint32 object_ids = 1 [(field_visibility) = FIELD_VISIBILITY_PUBLIC];
}

// --- Sidecar TCP framing (length-prefixed IpcEnvelope) ---

message IpcEnvelope {
  oneof msg {
    SessionStart session_start = 1;
    PlayerCommand player_command = 2;
    SessionEnd session_end = 3;
    ValidateDeck validate_deck = 4;
    PaymentQuery payment_query = 5;
  }
}

// Stateless implemented-card check (no engine, no session): the sidecar answers with
// ok = true and an empty missing_card_names iff every name resolves in the registry.
// Servatrice gates ruled game start on this so an unimplemented card never silently
// falls back to casual play. Also the extension point for future deck-editor coverage
// queries (e.g. a ListImplementedCards sibling).
message ValidateDeck {
  repeated string card_names = 1; // Oracle card names, duplicates allowed
}

// Deck lists cross IPC as Oracle card names; the engine resolves names to card ids
// (CardRegistry::id_for_name) and reports the mapping back via CardCatalog.
message PlayerDeck {
  int32 player_id = 1;
  // Was mainboard_card_id (C++-derived tricerules ids); the engine owns identity now.
  reserved 2;
  reserved "mainboard_card_id";
  // Oracle card names (e.g. "Lightning Bolt"), one entry per copy — empty = engine default test deck.
  repeated string mainboard_card_name = 3;
}

message SessionStart {
  uint64 game_id = 1;
  uint64 seed = 2;
  repeated int32 player_ids = 3;
  repeated PlayerDeck player_decks = 4;
  // Servatrice's VERSION_STRING, logged by the sidecar for build-skew observability.
  string servatrice_build = 5;
  // Dev gate, half 1 of 2: Servatrice asks for DevCommand support (from its own
  // COCKATRICE_RULED_DEV env var). The sidecar grants it only if its own
  // TRICERULES_DEV_COMMANDS env var is also set, so a production sidecar cannot be talked
  // into dev mode from upstream. See DevCommand.
  bool dev_commands_enabled = 6;
}

message PlayerCommand {
  int32 player_id = 1;
  bytes ruled_command = 2;
}

message SessionEnd {}

message PaymentQuery {
  int32 player_id = 1;
  PreviewPayment preview = 2;
}

message IpcResponse {
  bool ok = 1;
  string error = 2;
  optional RuledEventBatch batch = 3;
  // Oracle names the registry does not implement, sorted and deduplicated. Filled by
  // ValidateDeck and by a SessionStart that fails name resolution; empty otherwise.
  repeated string missing_card_names = 4;
  // Version handshake, filled on a successful SessionStart response. engine_build is the
  // sidecar's build id; card_data_hash is a stable hash of its embedded card data.
  // Servatrice logs both and stamps card_data_hash into the replay so
  // (seed, command log, data hash) reproduces the game. Empty on a sidecar that predates
  // the handshake (treated as a build-skew warning, not a refusal).
  string engine_build = 5;
  string card_data_hash = 6;
}
