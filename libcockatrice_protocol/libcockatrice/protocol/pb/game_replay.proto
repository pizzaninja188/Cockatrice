syntax = "proto2";
import "serverinfo_game.proto";
import "game_event_container.proto";

message GameReplay {
    optional uint64 replay_id = 1;
    optional ServerInfo_Game game_info = 2;
    repeated GameEventContainer event_list = 3;
    optional uint32 duration_seconds = 4;
    // Ruled game: deterministic replay (seed + concatenated ruled command blobs)
    optional uint64 ruled_seed = 5;
    optional bytes ruled_command_log = 6;
    // Stable hash of the engine's embedded card data at game start. With ruled_seed and
    // ruled_command_log this fully determines a ruled replay's reconstruction.
    optional string ruled_card_data_hash = 7;
}
