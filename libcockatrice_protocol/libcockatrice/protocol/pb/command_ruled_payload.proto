syntax = "proto2";
import "game_commands.proto";

// Wraps a serialized ruled.v1.RuledCommand (proto3 bytes)
message Command_RuledPayload {
  extend GameCommand {
    optional Command_RuledPayload ext = 1100;
  }
  optional bytes payload = 1;
  // Opaque correlation only; actor identity still comes from the authenticated participant.
  optional string diagnostic_request_id = 2;
  // No gameplay payload accompanies this marker. It pins server evidence, never downloads it.
  optional string diagnostic_report_id = 3;
}
