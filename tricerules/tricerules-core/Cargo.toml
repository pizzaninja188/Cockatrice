[package]
name = "tricerules-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tricerules-proto = { path = "../tricerules-proto" }
tricerules-cards = { path = "../tricerules-cards" }
thiserror.workspace = true
prost.workspace = true
rand = { version = "0.8", features = ["std_rng"] }
serde.workspace = true
serde_json = "1"

[dev-dependencies]
proptest.workspace = true

[features]
# Explicit offline draft engine constructor; not enabled by sidecar builds.
authoring = ["tricerules-cards/authoring"]
