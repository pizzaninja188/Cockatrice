[package]
name = "tricerules-cards"
version = "0.1.0"
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
tricerules-card-model = { path = "../tricerules-card-model" }
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
once_cell = "1"
roxmltree = { version = "0.20", optional = true }
serde_json = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
proptest.workspace = true

# Codegen/tracking binaries are feature-gated so default builds/CI don't pull their deps.
[features]
# Implementation-tracking checklist generator (see src/bin/gen_checklist.rs).
checklist = ["dep:roxmltree"]
# Fail-closed exact-recipe card generator (see src/bin/gen_cards.rs).
gencards = ["dep:serde_json", "dep:flate2", "dep:sha2"]
# Offline authoring tools; never enabled by the game server.
authoring = ["dep:serde_json", "dep:flate2", "dep:sha2"]

[[bin]]
name = "card-author"
path = "src/bin/card_author.rs"
required-features = ["authoring"]

[[bin]]
name = "gen-checklist"
path = "src/bin/gen_checklist.rs"
required-features = ["checklist"]

[[bin]]
name = "gen-cards"
path = "src/bin/gen_cards.rs"
required-features = ["gencards"]

[[test]]
name = "batch_registry"
path = "tests/suites/batch_registry.rs"

[[test]]
name = "deck_registry"
path = "tests/suites/deck_registry.rs"

[[test]]
name = "generated_registry"
path = "tests/suites/generated_registry.rs"

[[test]]
name = "mechanic_registry"
path = "tests/suites/mechanic_registry.rs"

[[test]]
name = "standard_registry"
path = "tests/suites/standard_registry.rs"
